<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KODH Real Estate · Jijiga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/*LEAFLET_CSS*/</style>
<style>
:root{
  --ink:#0f1720; --ink-2:#1b2530; --ink-3:#2a3643; --line:#33414f;
  --text:#eef2f5; --muted:#9aa8b5; --sand:#e3b56b; --sand-2:#f3d39c;
  --sale:#ffffff; --res:#f5a524; --sold:#8b97a3; --sel:#ef4444; --ok:#22c55e; --blue:#60a5fa;
  --r:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);
  font-family:Manrope,-apple-system,system-ui,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sand-2)}
.hidden{display:none!important}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;height:calc(58px + var(--safe-t));padding:var(--safe-t) 16px 0;
  display:flex;align-items:center;gap:18px;background:rgba(15,23,32,.96);border-bottom:1px solid var(--line);z-index:1000}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--sand);display:grid;place-items:center;color:var(--ink)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{background:none;border:0;padding:9px 14px;border-radius:10px;color:var(--muted);font-weight:700;cursor:pointer}
.tab.on{background:var(--ink-3);color:var(--text)}
.demo-badge{margin-left:auto;font-size:12px;color:var(--sand-2);border:1px solid #5a4a2e;background:#2b2417;padding:5px 10px;border-radius:999px;white-space:nowrap}
nav.bottom{display:none}

main{position:fixed;top:calc(58px + var(--safe-t));left:0;right:0;bottom:0}
.view{position:absolute;inset:0}

/* ---------- buyer map ---------- */
#view-map{display:grid;grid-template-columns:380px 1fr}
#side{background:var(--ink-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filters{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.filters h2{margin:0;font-size:18px}
.row{display:flex;gap:8px;align-items:center}
.field{display:grid;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
input[type=text],input[type=number],input[type=tel],select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--sand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ink);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--sand);color:var(--ink);border-color:var(--sand)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--sand);width:17px;height:17px}
.count{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
#results{overflow:auto;padding:10px;display:grid;gap:8px;align-content:start;flex:1}
.card{background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:grid;gap:4px;transition:border-color .15s}
.card:hover,.card.on{border-color:var(--sand)}
.card .price{font-size:18px;font-weight:800}
.card .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.sale{color:#d7f5df;background:#173a24}.pill.reserved{color:#ffd99a;background:#3d2c10}.pill.sold{color:#c8d0d8;background:#2b333c}
.card .top{display:flex;justify-content:space-between;align-items:center}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}

#map{position:relative;min-height:0;background:#0b1117}
.leaflet-container{background:#0b1117;font-family:inherit}
.layer-switch{position:absolute;top:12px;right:12px;z-index:500;display:flex;background:rgba(15,23,32,.92);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.layer-switch button{border:0;background:none;padding:8px 12px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.layer-switch button.on{background:var(--sand);color:var(--ink)}
.legend{position:absolute;left:12px;bottom:22px;z-index:500;background:rgba(15,23,32,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;display:flex;gap:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:10px;border-radius:2px;border:2px solid}
.price-tag{background:rgba(15,23,32,.85)!important;color:#fff!important;border:0!important;border-radius:7px!important;font-weight:800;font-size:12px;padding:2px 7px!important;box-shadow:none!important}
.price-tag::before{display:none}

/* detail panel */
#detail{position:absolute;top:12px;right:12px;bottom:12px;width:380px;z-index:600;background:var(--ink-2);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
#detail .head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
#detail .close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:18px}
#detail .body{overflow:auto;padding:14px 16px 18px;display:grid;gap:16px;align-content:start}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:17px}.stat span{font-size:12px;color:var(--muted)}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
table.sides{width:100%;border-collapse:collapse;font-size:14px}
table.sides td{padding:7px 0;border-bottom:1px solid var(--line)}
table.sides td:last-child{text-align:right;font-weight:700}
.road{color:var(--sand-2);font-weight:700;font-size:12px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo{aspect-ratio:4/3;border-radius:10px;background:var(--ink) center/cover no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;position:relative}
.photo b{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.note{font-size:13px;color:var(--muted);line-height:1.5;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--ink-3);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--sand);color:var(--ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:#3a1717;color:#fecaca}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}

/* ---------- capture ---------- */
#view-capture{overflow:auto}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(110px + var(--safe-b))}
.steps{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;height:5px;border-radius:5px;background:var(--ink-3)}.step.on{background:var(--sand)}
.wrap h2{margin:0 0 4px;font-size:22px}
.lead{color:var(--muted);margin:0 0 18px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.mode{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mode button{flex:1;border:0;background:none;padding:10px;font-weight:800;color:var(--muted);cursor:pointer}
.mode button.on{background:var(--ink-3);color:var(--text)}
.bricks{display:grid;gap:10px}
.brick{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px}
.brick.done{border-color:#24553a}
.brick .letter{width:44px;height:44px;border-radius:12px;background:var(--ink-3);display:grid;place-items:center;font-weight:800;font-size:20px}
.brick.done .letter{background:var(--ok);color:#06240f}
.brick .info b{display:block}.brick .info span{font-size:13px;color:var(--muted)}
.brick .acts{display:flex;gap:6px}
.brick .acts .btn{padding:10px 12px}
.bar{height:6px;border-radius:6px;background:var(--ink-3);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--sand);width:0}
.mini-map{height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.sizes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sizes .diag{grid-column:1/-1}
.unit{position:relative}.unit::after{content:"m";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.warn{background:#3a2a10;border:1px solid #6b4f1d;color:#ffe2b0;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.err{background:#3a1717;border:1px solid #6b2a2a;color:#fecaca;border-radius:12px;padding:10px 12px;font-size:14px}
.good{background:#123222;border:1px solid #24553a;color:#c9f3d6;border-radius:12px;padding:10px 12px;font-size:14px}
.footer-nav{position:sticky;bottom:calc(10px + var(--safe-b));display:flex;gap:10px;margin-top:18px}
.footer-nav .btn{flex:1;padding:14px}
.diagram{display:flex;gap:14px;align-items:center}
.diagram svg{flex:none}

/* ---------- manage ---------- */
#view-manage{overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{font-size:24px;display:block}.kpi span{color:var(--muted);font-size:12.5px}
.mrow{display:grid;grid-template-columns:1.5fr 1fr 1fr 150px auto;gap:10px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mrow .t b{display:block}.mrow .t span{font-size:12.5px;color:var(--muted)}
.mrow input,.mrow select{padding:8px 10px}
.mrow .btn{padding:9px 12px}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--sand);color:var(--ink);font-weight:800;padding:11px 16px;border-radius:12px;z-index:3000;box-shadow:var(--shadow)}

/* ---------- mobile ---------- */
@media (max-width:820px){
  header{height:calc(54px + var(--safe-t))}
  main{top:calc(54px + var(--safe-t));bottom:calc(62px + var(--safe-b))}
  .tabs{display:none}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(62px + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(15,23,32,.98);border-top:1px solid var(--line);z-index:1000}
  nav.bottom button{flex:1;border:0;background:none;color:var(--muted);font-weight:800;font-size:12px;display:grid;place-items:center;gap:2px;cursor:pointer}
  nav.bottom button.on{color:var(--sand)}
  nav.bottom svg{width:22px;height:22px}
  #view-map{display:block}
  #map{position:absolute;inset:0}
  #side{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:700;border-right:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--shadow);transition:height .25s}
  #side{overflow:hidden}
  #side.min{height:auto}
  #side.min #results,#side.min .filters .row{display:none}
  .grab{display:block!important;flex:none;width:100%;height:22px;cursor:pointer;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:8px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:var(--line)}
  .filters{flex:none}
  .mobile-only{display:inline-flex!important}
  .leaflet-control-zoom{display:none}
  .filters{padding:8px 14px 12px;gap:10px}
  .filters h2,.filters .more{display:none}
  #detail{left:0;right:0;bottom:0;top:auto;width:auto;max-height:60%;border-radius:20px 20px 0 0}
  body.detail-open #side{display:none}
  .grid2,.sizes{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .mrow{grid-template-columns:1fr 1fr}
  .mrow .t{grid-column:1/-1}
  .legend{bottom:auto;top:12px;font-size:11.5px;padding:6px 10px;gap:8px}
  .layer-switch{top:52px}
  .demo-badge{font-size:11px}
}
.grab{display:none}
/* map tools: small round buttons in the top-right corner */
.map-tools{position:absolute;top:12px;right:12px;z-index:550;display:flex;flex-direction:column;gap:8px}
.tool{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(15,23,32,.9);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:0}
.tool.on{background:var(--sand);color:var(--ink);border-color:var(--sand)}
.tool svg{width:22px;height:22px}
#layer-menu{position:absolute;top:0;right:54px;width:236px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);display:grid;gap:6px}
#layer-menu h5{margin:4px 2px 0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--ink);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;width:100%}
.opt.on{border-color:var(--sand);box-shadow:inset 0 0 0 1px var(--sand)}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:1px 2px}.lg i{width:16px;height:10px;border-radius:2px;border:2px solid;flex:none}
@media (min-width:821px){body.detail-open .map-tools{right:404px}}
/* drop pins (shown when zoomed out) */
.pin-icon{background:none!important;border:0!important}
.pin{position:relative;width:30px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));transform-origin:50% 100%}
.pin svg{width:30px;height:40px;display:block}
.pin span{position:absolute;bottom:41px;left:50%;transform:translateX(-50%);background:rgba(15,23,32,.92);color:#fff;font-weight:800;font-size:12px;padding:2px 7px;border-radius:7px;white-space:nowrap}
.pin.sel{transform:scale(1.3)}
.pin.search span{background:#1d4ed8}
/* search box with Google switch */
.place-search{position:relative}
.place-search input{padding-right:84px}
.gtoggle{position:absolute;right:6px;top:6px;height:calc(100% - 12px);max-height:34px;border:1px solid var(--line);background:var(--ink-3);color:var(--muted);border-radius:8px;font-weight:800;font-size:12.5px;padding:0 9px;cursor:pointer;white-space:nowrap}
.gtoggle.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.sr-muted{color:var(--muted);cursor:default!important;font-size:13.5px}
.sr-muted:hover{background:none!important}
/* ---------- TV presentation ---------- */
.tv-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--ink-3);color:var(--text);font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer}
.tv-btn svg{width:18px;height:18px}
.tv-btn + .demo-badge{margin-left:0}
.tv-only{display:none!important}
body.tv header, body.tv nav.bottom, body.tv #side, body.tv #detail, body.tv .map-tools, body.tv #place-sheet, body.tv #add-banner{display:none!important}
body.tv main{top:0!important;bottom:0!important}
body.tv #view-map{display:block}
body.tv #map{position:absolute;inset:0}
body.tv .tv-only{display:flex!important}
body.tv.spot .leaflet-tile-pane{filter:brightness(.62) saturate(.9)}
.tv-fade{transition:opacity .35s}
body.tv.idle .tv-fade{opacity:0;pointer-events:none}
body.tv.idle #map{cursor:none}
#tv-top{position:absolute;top:16px;left:16px;right:16px;z-index:800;align-items:center;gap:10px}
#tv-top .grow{flex:1}
.tvb{border:1px solid var(--line);background:rgba(15,23,32,.88);color:#fff;font-weight:800;font-size:16px;border-radius:12px;padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tvb.on{background:var(--sand);color:var(--ink);border-color:var(--sand)}
.tvb.icon{padding:11px 14px;font-size:18px}
#tv-count{font-size:18px;font-weight:800;background:rgba(15,23,32,.88);border:1px solid var(--line);border-radius:12px;padding:10px 16px;white-space:nowrap}
#tv-count small{color:var(--sand-2);font-weight:700;margin-left:8px}
.tv-maps{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(15,23,32,.88)}
.tv-maps button{border:0;background:none;color:var(--muted);font-weight:800;font-size:15px;padding:11px 14px;cursor:pointer}
.tv-maps button.on{background:var(--sand);color:var(--ink)}
#tv-panel{position:absolute;left:16px;top:84px;z-index:790;width:270px;flex-direction:column;gap:14px;background:rgba(15,23,32,.9);border:1px solid var(--line);border-radius:18px;padding:16px;max-height:calc(100% - 340px);overflow:auto}
#tv-panel h5{margin:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
#tv-panel .chips .chip{font-size:15px;padding:8px 13px}
#tv-panel input{font-size:16px}
#tv-panel .check{font-size:15px}
#tv-presults{background:var(--ink);border:1px solid var(--line);border-radius:12px;max-height:200px;overflow:auto}
#tv-presults div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:15px}
#tv-card{position:absolute;left:16px;right:16px;bottom:16px;z-index:800;background:rgba(15,23,32,.94);border:1px solid var(--line);border-radius:22px;padding:18px 22px;gap:22px;align-items:center;box-shadow:var(--shadow)}
#tv-card.empty{justify-content:center;color:var(--muted);font-size:18px}
#tv-card .main{display:grid;gap:6px;min-width:250px}
#tv-card .price{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05}
#tv-card .where{font-size:17px;color:var(--muted)}
#tv-card .facts{display:grid;grid-template-columns:repeat(4,auto);gap:10px 26px}
#tv-card .facts b{display:block;font-size:24px}
#tv-card .facts span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
#tv-card .ph{display:flex;gap:10px;margin-left:auto}
#tv-card .ph div{width:120px;height:90px;border-radius:12px;background:var(--ink) center/cover;border:1px solid var(--line);position:relative;cursor:pointer}
#tv-card .ph div b{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 7px;font-size:13px}
.tv-len{background:rgba(15,23,32,.9);color:#fff;font-weight:800;font-size:15px;padding:3px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.25);width:max-content}
.tv-len.road{background:var(--sand);color:var(--ink);border-color:var(--sand)}
#tv-light{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.92);display:grid;place-items:center;cursor:zoom-out}
#tv-light img{max-width:92vw;max-height:90vh;border-radius:12px}
#tv-light b{position:absolute;top:20px;left:24px;font-size:22px}
body.tv .leaflet-control-attribution{opacity:.6}
body.tv .price-tag{font-size:14px!important;padding:3px 9px!important}
@media (max-width:820px){
  .tv-btn span{display:none}
  #tv-top{flex-wrap:wrap;top:10px;left:10px;right:10px;gap:8px}
  #tv-top .grow,#tv-full{display:none!important}
  body.tv #tv-top{display:grid!important;grid-template-columns:auto auto 1fr auto;align-items:stretch}
  #tv-count{font-size:14px;padding:7px 10px;white-space:normal;min-width:0}
  #tv-count small{display:block;margin:1px 0 0;font-size:12px}

<body>

<header>
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f1720" stroke-width="2.6" stroke-linejoin="round"><path d="M4 18 L9 5 L20 8 L17 20 Z"/></svg></div>
    <div>KODH<small>Real Estate · Jijiga</small></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-view="map">Find land</button>
    <button class="tab" data-view="capture">Add plot</button>

  </div>
  <button class="tv-btn" id="tv-btn" title="TV presentation for buyers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>TV mode</span></button>
  <div class="demo-badge" title="Plots shown are made-up examples until real ones are captured">Demo data</div>
</header>

<main>
  <!-- ================= BUYER MAP ================= -->
  <section class="view" id="view-map">
    <aside id="side">
      <div class="grab" id="grab"></div>
      <div class="filters">
        <h2>Find land in Jijiga</h2>
        <div class="field place-search"><input type="text" id="f-place" placeholder="Search a place: mosque, school, market…" autocomplete="off"><button class="gtoggle" title="Also search Google places">+ Google</button><div id="place-results" class="hidden"></div></div>
        <div class="row">
          <div class="field" style="flex:1"><label>Area</label><select id="f-area"></select></div>
          <div class="field" style="flex:1"><label>Max budget (Birr)</label><input id="f-budget" type="number" inputmode="numeric" placeholder="Any"></div>
        </div>
        <div class="chips" id="budget-chips"></div>
        <div class="row more">
          <div class="field" style="flex:1"><label>Min size (m²)</label><input id="f-size" type="number" inputmode="numeric" placeholder="Any"></div>
          <div class="field" style="flex:1"><label>Sort</label>
            <select id="f-sort"><option value="price">Price: low to high</option><option value="-price">Price: high to low</option><option value="-area">Size: largest</option><option value="ppm">Price per m²</option></select></div>
        </div>
        <div class="count"><span id="count"></span><span style="display:flex;align-items:center;gap:12px"><label class="check"><input type="checkbox" id="f-sold"> Show sold</label><button class="chip on mobile-only" id="list-toggle">List</button></span></div>
      </div>
      <div id="results"></div>
    </aside>
    <div id="map">
      <div class="map-tools">
        <button class="tool" id="btn-layers" title="Map type and legend" aria-label="Map type and legend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg></button>
        <button class="tool" id="add-place" title="Add a place name" aria-label="Add a place name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><path d="M12 7v6M9 10h6"/></svg></button>
        <div id="layer-menu" class="hidden">
          <h5>Map</h5>
          <button class="opt on" data-layer="sat"><b>New satellite</b><span>Newest pictures, new roads</span></button>

          <h5>Legend</h5>
          <div class="lg"><i style="border-color:#fff"></i>For sale</div>
          <div class="lg"><i style="border-color:var(--res)"></i>Reserved</div>
          <div class="lg"><i style="border-color:var(--sold);border-style:dashed"></i>Sold</div>
          <div class="lg"><i style="border-color:var(--sand);border-width:0 0 3px;border-radius:0"></i>Side facing the road</div>
        </div>
      </div>
      <div class="addbanner hidden" id="add-banner">Tap the map where the place is <button id="add-cancel">Cancel</button></div>
      <div class="sheet hidden" id="place-sheet"></div>
      <div id="detail" class="hidden"></div>
      <!-- TV presentation overlays -->
      <div id="tv-top" class="tv-only tv-fade">
        <button class="tvb icon" id="tv-prev" title="Previous plot (←)">◀</button>
        <button class="tvb icon" id="tv-next" title="Next plot (→)">▶</button>
        <div id="tv-count"></div>
        <button class="tvb" id="tv-filters">Filters</button>
        <div class="grow"></div>
        <div class="tv-maps" id="tv-maps"><button data-layer="sat">New satellite</button><button data-layer="groad">Google</button><button data-layer="ghyb">Google sat.</button></div>
        <button class="tvb icon" id="tv-full" title="Full screen">⛶</button>
        <button class="tvb" id="tv-exit" title="Exit (Esc)">✕ Exit</button>
      </div>
      <div id="tv-panel" class="tv-only tv-fade">
        <h5>Areas</h5><div class="chips" id="tv-areas"></div>
        <h5>Budget</h5><div class="chips" id="tv-budgets"></div>
        <h5>Find a place</h5>
        <div class="place-search"><input type="text" id="tv-place" placeholder="Mosque, school, market…" autocomplete="off"><button class="gtoggle" title="Also search Google places">+ Google</button><div id="tv-presults" class="hidden"></div></div>
        <label class="check"><input type="checkbox" id="tv-sold"> Show sold plots</label>

      <div id="tv-card" class="tv-only"></div>
  </section>

  <!-- ================= CAPTURE ================= -->
  <section class="view hidden" id="view-capture">
    <div class="wrap" id="cap"></div>

  </section>
</main>

<nav class="bottom">
  <button data-view="map" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Find land</button>
  <button data-view="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg>Add plot</button>
  <button data-view="manage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Manage</button>
</nav>

<script>/*LEAFLET_JS*/</script>

<script>/*GMUTANT_JS*/</script>
<script>
"use strict";
/* =====================================================================
   KODH Real Estate prototype
   - Buyer map: plots as outlines, filter by area / budget / size, details.
   - Add plot: stand on each corner brick, average GPS, photo, tape sizes,
     app reshapes the outline to the exact tape sizes (KGeo.fitPlot).
   - Manage: status (for sale / reserved / sold), price, delete, export.
   Data is stored in this browser for now (a shared database comes next).
   ===================================================================== */

const JIJIGA = [9.3505, 42.7950];
const STORE = 'kodh.plots.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBirr = n => (n || 0).toLocaleString('en-US') + ' Br';
const shortBirr = n => n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0).replace(/\.0$/, '') + 'M' : Math.round(n / 1e3) + 'K';
const m2 = n => Math.round(n).toLocaleString('en-US') + ' m²';
const SIDES = ['AB', 'BC', 'CD', 'DA'];
const sideName = k => k[0] + '–' + k[1];
const STATUS_TEXT = { sale: 'For sale', reserved: 'Reserved', sold: 'Sold' };

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------------- storage ---------------- */
function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(plots)); }
  catch (e) { toast('Could not save on this device (storage full or blocked).'); }
}

/* ---------------- demo data ---------------- */
function demoPlots() {
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const k = Math.cos(JIJIGA[0] * Math.PI / 180);
  const ll = (o, x, y) => [o[0] + y / 110540, o[1] + x / (111320 * k)];
  const blocks = [
    { area: 'North', o: [9.3650, 42.7930], ang: 0.12, n: 5 },
    { area: 'East', o: [9.3540, 42.8120], ang: -0.35, n: 4 },
    { area: 'South', o: [9.3370, 42.7990], ang: 0.05, n: 5 },
    { area: 'West', o: [9.3480, 42.7780], ang: 0.6, n: 4 },
    { area: 'Centre', o: [9.3505, 42.7950], ang: 0.2, n: 3 }
  ];
  const owners = ['Abdi Hassan', 'Hodan Ahmed', 'Mohamed Farah', 'Fadumo Ali', 'Yusuf Omar', 'Amina Warsame', 'Ismail Jama', 'Sahra Abdullahi'];
  const out = []; let id = 1;
  blocks.forEach(b => {
    let x = 0;
    for (let i = 0; i < b.n; i++) {
      const w = 15 + Math.round(rnd() * 10), d = 20 + Math.round(rnd() * 12);
      const skew = (rnd() - .5) * 2.4, skew2 = (rnd() - .5) * 2;
      const local = [[x, 0], [x + w, 0], [x + w + skew2, d + skew], [x + skew2 * .3, d]];
      const c = Math.cos(b.ang), s = Math.sin(b.ang);
      const pts = local.map(p => ll(b.o, p[0] * c - p[1] * s, p[0] * s + p[1] * c));
      const sl = KGeo.sideLengthsLatLng(pts);
      const area = KGeo.areaLatLng(pts);
      const ppm = 2200 + Math.round(rnd() * 2600) + (b.area === 'Centre' ? 2500 : 0);
      const r = rnd();
      out.push({
        id: 'demo' + (id++), demo: true, area: b.area,
        title: 'Plot ' + b.area[0] + (i + 1), price: Math.round(area * ppm / 10000) * 10000,
        status: r < .68 ? 'sale' : r < .82 ? 'reserved' : 'sold',
        owner: owners[Math.floor(rnd() * owners.length)], phone: '+251 9' + (10000000 + Math.floor(rnd() * 89999999)),
        road: 'AB', notes: '',
        corners: pts.map(p => ({ lat: p[0], lng: p[1], acc: 3, n: 0, photo: null })),
        sides: { AB: +sl[0].toFixed(1), BC: +sl[1].toFixed(1), CD: +sl[2].toFixed(1), DA: +sl[3].toFixed(1) },
        fitted: pts, areaM2: area, method: 'demo', rms: 0, created: Date.now() - id * 86400000
      });
      x += w + 0.4;
    }
  });
  return out;
}

let plots = load();
if (!plots || !plots.length) { plots = demoPlots(); save(); }
const hasDemo = () => plots.some(p => p.demo);

/* ---------------- views ---------------- */
let currentView = 'map';
function show(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + view));
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (view === 'map') { setTimeout(() => map.invalidateSize(), 30); renderMap(); }
  if (view === 'capture') renderCapture();
  if (view === 'manage') renderManage();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => show(b.dataset.view));

/* ---------------- tile layers ---------------- */
function satLayer() {
  return L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 21, maxNativeZoom: 18, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 21, maxNativeZoom: 18, opacity: .85 }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 21, maxNativeZoom: 18, opacity: .7 })
  ]);
}
function streetLayer() {
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 20, maxNativeZoom: 19, attribution: '© OpenStreetMap contributors' });
}

/* =====================================================================
   BUYER MAP
   ===================================================================== */
const map = L.map('map', { zoomControl: false, attributionControl: true, maxZoom: 21 }).setView(JIJIGA, 14);
L.control.zoom({ position: 'bottomright' }).addTo(map);
const layers = { sat: satLayer() };
layers.sat.addTo(map);

/* Google map layers: loaded only when someone taps a Google button (saves the free monthly allowance).
   The key is meant to be public in web pages; it is protected by the website restriction set in Google Cloud. */
const GOOGLE_KEY = 'AIzaSyDh6OtjzLM4i9kO6j7jTOiLyQrGG6T6vlg';
let googlePromise = null;
function loadGoogle() {
  if (window.google && google.maps && google.maps.Map) return Promise.resolve();
  if (googlePromise) return googlePromise;
  googlePromise = new Promise((resolve, reject) => {
    window.__kodhGoogleReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + GOOGLE_KEY + '&libraries=places&loading=async&callback=__kodhGoogleReady';
    s.async = true;
    s.onerror = () => { googlePromise = null; reject(new Error('net')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.google && google.maps && google.maps.Map)) { googlePromise = null; reject(new Error('timeout')); } }, 20000);
  });
  return googlePromise;
}
window.gm_authFailure = () => { toast('Google refused the map key. Showing the new satellite map instead.'); switchLayer('sat'); };

const MAP_NAMES = { sat: 'New satellite', groad: 'Google', ghyb: 'Google satellite' };
let mapChoice = 'sat';     // remembered for the capture map too
// make a fresh background layer (Google ones load Google first)
async function makeBase(name) {
  if (name === 'sat') return satLayer();
  try { toast('Loading Google map…'); await loadGoogle(); }
  catch (e) { toast('Could not load Google map. Check the internet connection.'); return null; }
  return L.gridLayer.googleMutant({ type: name === 'groad' ? 'roadmap' : 'hybrid', maxZoom: 21 });
}
async function switchLayer(name) {
  if (!layers[name]) { const l = await makeBase(name); if (!l) return switchLayer('sat'); layers[name] = l; }
  mapChoice = name;
  if (name !== 'sat') setGSearch(true);
  document.querySelectorAll('#layer-menu .opt').forEach(x => x.classList.toggle('on', x.dataset.layer === name));
  Object.values(layers).forEach(l => map.removeLayer(l));
  layers[name].addTo(map);
}
const showLayerMenu = on => { $('#layer-menu').classList.toggle('hidden', !on); $('#btn-layers').classList.toggle('on', on); };
$('#btn-layers').onclick = () => showLayerMenu($('#layer-menu').classList.contains('hidden'));
document.querySelectorAll('#layer-menu .opt').forEach(b => b.onclick = () => { switchLayer(b.dataset.layer); showLayerMenu(false); });
map.on('click movestart', () => showLayerMenu(false));

const plotLayer = L.layerGroup().addTo(map);
const pinLayer = L.layerGroup();          // drop pins for zoomed-out view
const PIN_COL = { sale: '#ef4444', reserved: '#f5a524', sold: '#8b97a3' };
function pinIcon(p, sel) {
  return L.divIcon({ className: 'pin-icon', iconSize: [30, 40], iconAnchor: [15, 40],
    html: `<div class="pin ${sel ? 'sel' : ''}"><span>${p.status === 'sold' ? 'Sold' : shortBirr(p.price)}</span><svg viewBox="0 0 30 40"><path d="M15 39C15 39 2 23.5 2 14a13 13 0 0 1 26 0c0 9.5-13 25-13 25z" fill="${sel ? '#ef4444' : PIN_COL[p.status]}" stroke="#fff" stroke-width="2.2"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg></div>` });
}
const earthUrl = c => `https://earth.google.com/web/@${c[0].toFixed(6)},${c[1].toFixed(6)},1500a,350d,35y,0h,60t,0r`;
const plotCenter = p => p.fitted.reduce((a, q) => [a[0] + q[0] / p.fitted.length, a[1] + q[1] / p.fitted.length], [0, 0]);
function updatePins() {
  const want = map.getZoom() < 16;
  if (want && !map.hasLayer(pinLayer)) pinLayer.addTo(map);
  if (!want && map.hasLayer(pinLayer)) map.removeLayer(pinLayer);
}
let selected = null;
const shapes = {};      // id -> {poly, road, tag}
const filt = { area: '', budget: 0, size: 0, sort: 'price', sold: false };

const BUDGETS = [1e6, 2e6, 3e6, 5e6];
$('#budget-chips').innerHTML = BUDGETS.map(b => `<button class="chip" data-b="${b}">≤ ${shortBirr(b)}</button>`).join('');
$('#budget-chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const v = +b.dataset.b; filt.budget = filt.budget === v ? 0 : v;
  $('#f-budget').value = filt.budget || ''; renderMap();
};
$('#f-area').onchange = e => { filt.area = e.target.value; renderMap(true); };
$('#f-budget').oninput = e => { filt.budget = +e.target.value || 0; renderMap(); };
$('#f-size').oninput = e => { filt.size = +e.target.value || 0; renderMap(); };
$('#f-sort').onchange = e => { filt.sort = e.target.value; renderMap(); };
$('#f-sold').onchange = e => { filt.sold = e.target.checked; renderMap(); };
const setSheet = min => { $('#side').classList.toggle('min', min); $('#list-toggle').textContent = min ? 'List' : 'Map'; };
const toggleSheet = () => setSheet(!$('#side').classList.contains('min'));
const isPhone = () => window.innerWidth <= 820;
const flyPad = () => isPhone() ? { paddingTopLeft: [30, 70], paddingBottomRight: [30, Math.round(window.innerHeight * .58)] } : { paddingTopLeft: [60, 60], paddingBottomRight: [420, 60] };
$('#grab').onclick = toggleSheet; $('#list-toggle').onclick = toggleSheet;

function styleFor(p, isSel) {
  if (tvOn && selected && !isSel) return { color: '#ffffff', weight: 1.5, opacity: .45, fillColor: '#ffffff', fillOpacity: .04, dashArray: p.status === 'sold' ? '5 5' : null };
  if (isSel) return { color: '#ef4444', weight: 3.5, fillColor: '#ef4444', fillOpacity: .28, dashArray: null };
  if (p.status === 'sold') return { color: '#8b97a3', weight: 2, fillColor: '#8b97a3', fillOpacity: .12, dashArray: '5 5' };
  if (p.status === 'reserved') return { color: '#f5a524', weight: 2.5, fillColor: '#f5a524', fillOpacity: .12, dashArray: null };
  return { color: '#ffffff', weight: 2.5, fillColor: '#ffffff', fillOpacity: .1, dashArray: null };
}

function visiblePlots() {
  let list = plots.filter(p =>
    (!filt.area || p.area === filt.area) &&
    (!filt.budget || p.price <= filt.budget) &&
    (!filt.size || p.areaM2 >= filt.size) &&
    (filt.sold || p.status !== 'sold'));
  const s = filt.sort;
  list.sort((a, b) => s === 'price' ? a.price - b.price : s === '-price' ? b.price - a.price :
    s === '-area' ? b.areaM2 - a.areaM2 : a.price / a.areaM2 - b.price / b.areaM2);
  return list;
}

function renderAreas() {
  const areas = [...new Set(plots.map(p => p.area).filter(Boolean))].sort();
  const sel = $('#f-area'); const cur = filt.area;
  sel.innerHTML = '<option value="">All areas</option>' + areas.map(a => `<option ${a === cur ? 'selected' : ''}>${esc(a)}</option>`).join('');
}

function dims(p) {
  const s = p.sides || {};
  if (s.AB && s.BC) return Math.round((s.AB + s.CD) / 2) + ' × ' + Math.round((s.BC + s.DA) / 2) + ' m';
  return '';
}

function renderMap(fit) {
  renderAreas();
  document.querySelectorAll('#budget-chips .chip').forEach(c => c.classList.toggle('on', +c.dataset.b === filt.budget));
  const list = visiblePlots();
  plotLayer.clearLayers();
  pinLayer.clearLayers();
  for (const k in shapes) delete shapes[k];
  list.forEach(p => {
    const poly = L.polygon(p.fitted, styleFor(p, selected === p.id)).addTo(plotLayer);
    poly.on('click', e => { L.DomEvent.stopPropagation(e); if (addingPlace) { placeAt(e.latlng); return; } select(p.id, false); if (tvOn) tvUpdateTop(); });
    const tag = L.tooltip({ permanent: true, direction: 'center', className: 'price-tag', opacity: 1 })
      .setContent(p.status === 'sold' ? 'Sold' : shortBirr(p.price));
    poly.bindTooltip(tag);
    let road = null;
    if (p.road && SIDES.includes(p.road)) {
      const i = SIDES.indexOf(p.road);
      road = L.polyline([p.fitted[i], p.fitted[(i + 1) % 4]], { color: '#e3b56b', weight: 5, opacity: .95, interactive: false }).addTo(plotLayer);
    }
    const pin = L.marker(plotCenter(p), { icon: pinIcon(p, selected === p.id), keyboard: false, zIndexOffset: selected === p.id ? 1000 : 0 })
      .on('click', e => { L.DomEvent.stopPropagation(e); select(p.id, true); if (tvOn) tvUpdateTop(); }).addTo(pinLayer);
    shapes[p.id] = { poly, road, pin };
  });
  updateTags();
  $('#count').textContent = list.length + (list.length === 1 ? ' plot' : ' plots') + (filt.budget ? ' under ' + shortBirr(filt.budget) + ' Br' : '');
  $('#results').innerHTML = list.length ? list.map(p => `
    <div class="card ${selected === p.id ? 'on' : ''}" data-id="${p.id}">
      <div class="top"><span class="price">${fmtBirr(p.price)}</span><span class="pill ${p.status}">${STATUS_TEXT[p.status]}</span></div>
      <div class="meta">${m2(p.areaM2)} · ${dims(p)} · ${esc(p.area)}</div>
      <div class="meta">${esc(p.title)}${p.road ? ' · road on ' + sideName(p.road) : ''}</div>
    </div>`).join('') : '<div class="empty">No plots match. Try a bigger budget or another area.</div>';
  if (fit && list.length) map.fitBounds(L.featureGroup(Object.values(shapes).map(s => s.poly)).getBounds(), { padding: [40, 40], maxZoom: 18 });
}
$('#results').onclick = e => { const c = e.target.closest('.card'); if (c) select(c.dataset.id, true); };
$('#results').onmouseover = e => {
  const c = e.target.closest('.card'); Object.keys(shapes).forEach(id => shapes[id].poly.setStyle({ weight: id === (c && c.dataset.id) || id === selected ? 4 : 2.5 }));
};

function updateTags() {
  updatePins();
  const showTags = map.getZoom() >= 16 && !(tvOn && selected);
  Object.values(shapes).forEach(s => { if (showTags) s.poly.openTooltip(); else s.poly.closeTooltip(); });
}
map.on('zoomend', updateTags);

function select(id, fly) {
  selected = id;
  const p = plots.find(x => x.id === id);
  Object.keys(shapes).forEach(k => {
    const q = plots.find(x => x.id === k);
    shapes[k].poly.setStyle(styleFor(q, k === id));
    if (k === id) shapes[k].poly.bringToFront();
    if (shapes[k].pin) { shapes[k].pin.setIcon(pinIcon(q, k === id)); shapes[k].pin.setZIndexOffset(k === id ? 1000 : 0); }
  });
  document.querySelectorAll('#results .card').forEach(c => c.classList.toggle('on', c.dataset.id === id));
  if (!p) return;
  if (fly) map.flyToBounds(L.latLngBounds(p.fitted), Object.assign({ maxZoom: tvOn ? 21 : 19, duration: .8 }, tvOn ? tvPad() : flyPad()));
  if (tvOn) { renderTvCard(p); return; }
  renderDetail(p);
  if (isPhone()) setSheet(true);
}

function renderDetail(p) {
  const d = $('#detail'); d.classList.remove('hidden'); document.body.classList.add('detail-open');
  const c = p.fitted.reduce((a, q) => [a[0] + q[0] / 4, a[1] + q[1] / 4], [0, 0]);
  const accs = p.corners.map(x => x.acc).filter(Boolean);
  const acc = accs.length ? Math.round(Math.max(...accs)) : null;
  const tapeRows = SIDES.map(k => `<tr><td>Side ${sideName(k)} ${p.road === k ? '<span class="road">· ROAD</span>' : ''}</td><td>${p.sides && p.sides[k] ? p.sides[k].toFixed(1) + ' m' : '—'}</td></tr>`).join('')
    + (p.sides && p.sides.AC ? `<tr><td>Diagonal A–C</td><td>${p.sides.AC.toFixed(1)} m</td></tr>` : '');
  const photos = p.corners.map((x, i) => `<div class="photo" ${x.photo ? `style="background-image:url(${x.photo})"` : ''}><b>${'ABCD'[i]}</b>${x.photo ? '' : 'No photo yet'}</div>`).join('');
  const source = p.method === 'demo' ? 'Example plot for the demo.' :
    p.method === 'gps' ? 'Shape from GPS only (no tape sizes yet), so sizes are approximate.' :
    'Sizes are from the tape measure. Position is from the phone GPS at the corner bricks' + (acc ? ', about ±' + acc + ' m' : '') + '.';
  d.innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <div class="head">
      <span class="pill ${p.status}" style="justify-self:start">${STATUS_TEXT[p.status]}</span>
      <div class="big">${fmtBirr(p.price)}</div>
      <div style="color:var(--muted)">${esc(p.title)} · ${esc(p.area)}, Jijiga</div>
    </div>
    <div class="body">
      <div class="stats">
        <div class="stat"><b>${m2(p.areaM2)}</b><span>Land size</span></div>
        <div class="stat"><b>${dims(p) || '—'}</b><span>About</span></div>
        <div class="stat"><b>${Math.round(p.price / p.areaM2).toLocaleString('en-US')} Br</b><span>Per m²</span></div>
        <div class="stat"><b>${p.road ? sideName(p.road) : '—'}</b><span>Side facing road</span></div>
      </div>
      <div class="sec"><h4>Measurements</h4><table class="sides">${tapeRows}</table></div>
      <div class="sec"><h4>Corner bricks</h4><div class="photos">${photos}</div></div>
      <div class="note">${source}</div>
      ${p.notes ? `<div class="sec"><h4>Notes</h4><div class="note">${esc(p.notes)}</div></div>` : ''}
      <div class="sec"><h4>Seller (agent only)</h4><div class="note">${esc(p.owner || '—')}<br>${esc(p.phone || '')}</div></div>
      <div class="btns">
        <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${c[0].toFixed(6)},${c[1].toFixed(6)}">Directions</a>
        <a class="btn ghost" target="_blank" rel="noopener" href="${earthUrl(c)}" title="Opens Google Earth, tilted 3D view">3D view</a>
        <button class="btn ghost" id="d-zoom">Zoom to plot</button>
      </div>
      <div class="field"><label>Status</label>
        <select id="d-status">${Object.keys(STATUS_TEXT).map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${STATUS_TEXT[s]}</option>`).join('')}</select></div>
    </div>`;
  d.querySelector('.close').onclick = () => { d.classList.add('hidden'); document.body.classList.remove('detail-open'); selected = null; renderMap(); };
  d.querySelector('#d-zoom').onclick = () => map.flyToBounds(L.latLngBounds(p.fitted), Object.assign({ maxZoom: 20 }, flyPad()));
  d.querySelector('#d-status').onchange = e => { p.status = e.target.value; save(); renderMap(); renderDetail(p); toast('Marked as ' + STATUS_TEXT[p.status]); };
}

/* =====================================================================
   PLACE NAMES (KODH's own labels: mosques, schools, markets, areas…)
   ===================================================================== */
const PSTORE = 'kodh.places.v1';
const PTYPES = { mosque: ['Mosque', '#22c55e'], school: ['School', '#60a5fa'], market: ['Market / shops', '#f5a524'],
  health: ['Hospital / clinic', '#ef4444'], hotel: ['Hotel / restaurant', '#c084fc'], office: ['Office / government', '#94a3b8'],
  road: ['Road name', '#e3b56b'], area: ['Area / neighbourhood', '#f3d39c'], other: ['Other', '#ffffff'] };
let places = [];
try { places = JSON.parse(localStorage.getItem(PSTORE) || '[]'); } catch (e) { places = []; }
const savePlaces = () => { try { localStorage.setItem(PSTORE, JSON.stringify(places)); } catch (e) { toast('Could not save on this device.'); } };
const placeLayer = L.layerGroup().addTo(map);
let addingPlace = false;

function renderPlaces() {
  placeLayer.clearLayers();
  const z = map.getZoom();
  places.forEach(pl => {
    const isArea = pl.type === 'area';
    if (z < (isArea ? 13 : 15)) return;
    const col = (PTYPES[pl.type] || PTYPES.other)[1];
    const icon = L.divIcon({ className: 'pl-icon', iconSize: [0, 0],
      html: `<div class="pl ${isArea ? 'area' : ''}"><i style="background:${col}"></i>${esc(pl.name)}</div>` });
    L.marker([pl.lat, pl.lng], { icon, keyboard: false, zIndexOffset: isArea ? -100 : 100 })
      .on('click', () => openPlaceSheet(pl)).addTo(placeLayer);
  });
}
map.on('zoomend', renderPlaces);
// clicks on panels and buttons over the map must not count as map taps
['.map-tools', '#add-banner', '#place-sheet', '#detail'].forEach(sel => { const el = $(sel); if (el) { L.DomEvent.disableClickPropagation(el); L.DomEvent.disableScrollPropagation(el); } });

function setAdding(on) {
  addingPlace = on;
  $('#map').classList.toggle('adding', on);
  $('#add-banner').classList.toggle('hidden', !on);
  $('#add-place').classList.toggle('on', on); if (on) showLayerMenu(false);
  if (on) { $('#detail').classList.add('hidden'); document.body.classList.remove('detail-open'); if (isPhone()) setSheet(true); }
}
$('#add-place').onclick = () => setAdding(!addingPlace);
$('#add-cancel').onclick = () => setAdding(false);
map.on('click', e => { if (addingPlace) placeAt(e.latlng); });

function placeAt(latlng) {
  setAdding(false);
  if (map.getZoom() < 16) map.setView(latlng, 17);
  openPlaceSheet({ id: null, name: '', type: 'mosque', lat: latlng.lat, lng: latlng.lng });
}

function openPlaceSheet(pl) {
  const sh = $('#place-sheet'); sh.classList.remove('hidden');
  const isNew = !pl.id; let type = pl.type;
  sh.innerHTML = `<h3>${isNew ? 'Name this place' : 'Place name'}</h3>
    <input type="text" id="pl-name" placeholder="e.g. Al-Furqan Mosque" value="${esc(pl.name)}" maxlength="60">
    <div class="types">${Object.keys(PTYPES).map(k => `<button class="chip ${k === type ? 'on' : ''}" data-t="${k}">${PTYPES[k][0]}</button>`).join('')}</div>
    <div class="btns">${isNew ? '' : '<button class="btn danger" id="pl-del">Delete</button>'}<button class="btn ghost" id="pl-cancel">Cancel</button><button class="btn primary" id="pl-save">Save</button></div>`;
  sh.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { type = b.dataset.t; sh.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); });
  const close = () => sh.classList.add('hidden');
  sh.querySelector('#pl-cancel').onclick = close;
  sh.querySelector('#pl-save').onclick = () => {
    const name = sh.querySelector('#pl-name').value.trim();
    if (!name) { toast('Type the name first'); return; }
    if (isNew) places.push({ id: 'pl' + Date.now().toString(36), name, type, lat: pl.lat, lng: pl.lng, created: Date.now() });
    else Object.assign(places.find(x => x.id === pl.id), { name, type });
    savePlaces(); renderPlaces(); close(); toast(isNew ? 'Place added' : 'Place updated');
  };
  if (!isNew) {
    const del = sh.querySelector('#pl-del');
    del.onclick = () => {
      if (!del.dataset.armed) { del.dataset.armed = 1; del.textContent = 'Sure?'; return; }
      places = places.filter(x => x.id !== pl.id); savePlaces(); renderPlaces(); close(); toast('Place deleted');
    };
  }
  setTimeout(() => sh.querySelector('#pl-name').focus(), 50);
}

// search place names (also matches plot titles and areas)
/* Search: KODH's own place names, plus Google places when "+ Google" is on
   (it turns on by itself when a Google map is shown). */
let gSearch = false;
const searchLayer = L.layerGroup().addTo(map);
function setGSearch(on) { gSearch = on; document.querySelectorAll('.gtoggle').forEach(b => { b.classList.toggle('on', on); b.textContent = on ? '✓ Google' : '+ Google'; }); }
document.querySelectorAll('.gtoggle').forEach(b => b.onclick = () => {
  setGSearch(!gSearch);
  const inp = b.parentElement.querySelector('input'); if (inp.value.trim()) inp.dispatchEvent(new Event('input')); inp.focus();
});
function searchPin(ll, name) {
  searchLayer.clearLayers();
  L.marker(ll, { keyboard: false, zIndexOffset: 2000, icon: L.divIcon({ className: 'pin-icon', iconSize: [30, 40], iconAnchor: [15, 40],
    html: `<div class="pin search"><span>${esc(name)}</span><svg viewBox="0 0 30 40"><path d="M15 39C15 39 2 23.5 2 14a13 13 0 0 1 26 0c0 9.5-13 25-13 25z" fill="#2563eb" stroke="#fff" stroke-width="2.2"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg></div>` }) })
    .on('click', () => searchLayer.clearLayers()).addTo(searchLayer);
}
function attachSearch(input, box, done) {
  let timer = null, seq = 0, token = null;
  input.oninput = () => {
    const q = input.value.trim(), ql = q.toLowerCase();
    if (!q) { box.classList.add('hidden'); return; }
    const mine = places.filter(pl => pl.name.toLowerCase().includes(ql)).slice(0, 6);
    let html = mine.map(pl => `<div data-id="${pl.id}">${esc(pl.name)}<small>${(PTYPES[pl.type] || PTYPES.other)[0]}</small></div>`).join('');
    clearTimeout(timer); const my = ++seq;
    if (!gSearch) {
      box.innerHTML = html || '<div class="sr-muted">None of your place names match. Tap “+ Google” to search Google too.</div>';
      box.classList.remove('hidden'); return;
    }
    box.innerHTML = html + '<div class="sr-muted g-wait">Searching Google…</div>';
    box.classList.remove('hidden');
    timer = setTimeout(async () => {
      let extra;
      try {
        await loadGoogle();
        const { AutocompleteSuggestion, AutocompleteSessionToken } = await google.maps.importLibrary('places');
        token = token || new AutocompleteSessionToken();
        const res = await AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: q, sessionToken: token,
          locationBias: { center: { lat: JIJIGA[0], lng: JIJIGA[1] }, radius: 30000 }, includedRegionCodes: ['et'] });
        if (my !== seq) return;
        const preds = (res.suggestions || []).map(x => x.placePrediction).filter(Boolean).slice(0, 6);
        box._preds = preds;
        extra = preds.length ? preds.map((pp, i) => `<div data-g="${i}">${esc(pp.text.text)}<small>Google</small></div>`).join('') : '<div class="sr-muted">Google found nothing with that name.</div>';
      } catch (err) {
        if (my !== seq) return;
        console.log('Google search error', err);
        extra = '<div class="sr-muted">Google search is not available right now.</div>';
      }
      const w = box.querySelector('.g-wait'); if (w) w.remove();
      box.insertAdjacentHTML('beforeend', extra);
    }, 350);
  };
  box.onclick = async e => {
    const d = e.target.closest('[data-id],[data-g]'); if (!d) return;
    box.classList.add('hidden'); done();
    if (d.dataset.id) {
      const pl = places.find(x => x.id === d.dataset.id); input.value = pl.name;
      searchLayer.clearLayers(); map.flyTo([pl.lat, pl.lng], 17, { duration: .8 }); return;
    }
    const pred = (box._preds || [])[+d.dataset.g]; if (!pred) return;
    input.value = pred.text.text;
    try {
      const place = pred.toPlace();
      await place.fetchFields({ fields: ['location', 'displayName'] });
      token = null;
      const ll = [place.location.lat(), place.location.lng()];
      searchPin(ll, place.displayName || input.value);
      map.flyTo(ll, 17, { duration: .9 });
    } catch (err) { console.log(err); toast('Could not open that Google place'); }
  };
}
attachSearch($('#f-place'), $('#place-results'), () => { if (isPhone()) setSheet(true); });

/* =====================================================================
   ADD PLOT (capture)
   ===================================================================== */
const blankDraft = () => ({ step: 1, title: '', area: '', price: '', owner: '', phone: '', notes: '', road: 'AB',
  corners: [null, null, null, null], sides: { AB: '', BC: '', CD: '', DA: '', AC: '' } });
let draft = blankDraft();
let gpsMode = (navigator.geolocation && window.isSecureContext) ? 'real' : 'demo';
let capturing = null;   // {i, timer, watch, samples, start}
let capMap = null, capLayer = null;
let demoTruth = null;   // hidden true corners for demo GPS

function stepsBar(n) { return '<div class="steps">' + [1, 2, 3, 4].map(i => `<div class="step ${i <= n ? 'on' : ''}"></div>`).join('') + '</div>'; }

function renderCapture() {
  const el = $('#cap');
  stopCapture(true);
  if (capMap) { capMap.remove(); capMap = null; }
  if (draft.step === 1) {
    const areas = [...new Set(plots.map(p => p.area))].sort();
    el.innerHTML = stepsBar(1) + `
      <h2>New plot · details</h2>
      <p class="lead">Fill this in with the seller. Next, you'll walk to each corner brick.</p>
      <div class="panel">
        <div class="grid2">
          <div class="field"><label>Area</label><input type="text" id="c-area" list="areas" placeholder="e.g. North" value="${esc(draft.area)}">
            <datalist id="areas">${areas.map(a => `<option value="${esc(a)}">`).join('')}</datalist></div>
          <div class="field"><label>Asking price (Birr)</label><input type="number" inputmode="numeric" id="c-price" placeholder="2000000" value="${esc(draft.price)}"></div>
          <div class="field"><label>Owner name (on the bricks)</label><input type="text" id="c-owner" value="${esc(draft.owner)}"></div>
          <div class="field"><label>Owner phone</label><input type="tel" id="c-phone" value="${esc(draft.phone)}"></div>
          <div class="field"><label>Plot name (optional)</label><input type="text" id="c-title" placeholder="e.g. Corner plot near school" value="${esc(draft.title)}"></div>
          <div class="field"><label>Which side faces the road?</label>
            <select id="c-road">${['AB', 'BC', 'CD', 'DA'].map(k => `<option value="${k}" ${draft.road === k ? 'selected' : ''}>Side ${sideName(k)}</option>`).join('')}<option value="" ${!draft.road ? 'selected' : ''}>No road</option></select></div>
        </div>
        <div class="field"><label>Notes</label><textarea id="c-notes" rows="2" placeholder="Water, electricity, neighbours, documents…">${esc(draft.notes)}</textarea></div>
        <div class="diagram">${cornerDiagram()}<div class="note">Name the corners <b>A, B, C, D</b> in order as you walk around the plot. Start with <b>A</b> at a corner on the road, so <b>A–B</b> is the road side.</div></div>
      </div>
      <div class="footer-nav"><button class="btn primary" id="next">Next: corner bricks →</button></div>`;
    $('#next').onclick = () => {
      draft.area = $('#c-area').value.trim(); draft.price = $('#c-price').value; draft.owner = $('#c-owner').value.trim();
      draft.phone = $('#c-phone').value.trim(); draft.title = $('#c-title').value.trim(); draft.road = $('#c-road').value; draft.notes = $('#c-notes').value.trim();
      if (!draft.area || !(+draft.price > 0)) { toast('Add the area and the price first.'); return; }
      draft.step = 2; renderCapture();
    };
    return;
  }
  if (draft.step === 2) {
    el.innerHTML = stepsBar(2) + `
      <h2>Corner bricks</h2>
      <p class="lead">Stand right on each brick and tap <b>Capture</b>. Keep still for the countdown; the phone takes many GPS readings and averages them. Take a photo of the brick with the name showing.</p>
      <div class="panel">
        <div class="mode"><button data-m="real" class="${gpsMode === 'real' ? 'on' : ''}">Real GPS</button><button data-m="demo" class="${gpsMode === 'demo' ? 'on' : ''}">Demo GPS (practice)</button></div>
        <div id="gps-msg"></div>
        <div class="bricks" id="bricks"></div>
        <div class="mini-map" id="cap-map"></div>
      </div>
      <div class="footer-nav"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="next">Next: tape sizes →</button></div>`;
    el.querySelectorAll('.mode button').forEach(b => b.onclick = () => { gpsMode = b.dataset.m; renderCapture(); });
    $('#back').onclick = () => { draft.step = 1; renderCapture(); };
    $('#next').onclick = () => {
      if (draft.corners.some(c => !c)) { toast('Capture all 4 bricks first.'); return; }
      draft.step = 3; renderCapture();
    };
    if (gpsMode === 'real' && !window.isSecureContext) $('#gps-msg').innerHTML = '<div class="err">Real GPS needs the page opened over https.</div>';
    if (gpsMode === 'demo') $('#gps-msg').innerHTML = '<div class="note">Practice mode: pretends you are walking around a plot in Jijiga, with realistic GPS errors. Use <b>Real GPS</b> on site.</div>';
    renderBricks();
    initCapMap();
    return;
  }
  if (draft.step === 3) {
    const s = draft.sides;
    el.innerHTML = stepsBar(3) + `
      <h2>Tape sizes</h2>
      <p class="lead">Measure brick to brick with a tape, or copy the sizes from the sale agreement. The <b>diagonal A–C</b> locks the exact shape: please measure it.</p>
      <div class="panel">
        <div class="diagram">${cornerDiagram(true)}<div class="note">Sides go around the plot: A–B, B–C, C–D, D–A. The diagonal goes across, from brick A to brick C.</div></div>
        <div class="sizes">
          ${SIDES.map(k => `<div class="field"><label>Side ${sideName(k)}${draft.road === k ? ' (road)' : ''}</label><div class="unit"><input type="number" step="0.1" inputmode="decimal" data-s="${k}" value="${esc(s[k])}"></div></div>`).join('')}
          <div class="field diag"><label>Diagonal A–C (recommended)</label><div class="unit"><input type="number" step="0.1" inputmode="decimal" data-s="AC" value="${esc(s.AC)}"></div></div>
        </div>
        <div id="gps-compare"></div>
        ${gpsMode === 'demo' && demoTruth ? '<button class="btn ghost" id="fill">Fill practice tape sizes</button>' : ''}
      </div>
      <div class="footer-nav"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="next">Check the shape →</button></div>`;
    const readSides = () => el.querySelectorAll('[data-s]').forEach(i => { s[i.dataset.s] = i.value; });
    const compare = () => {
      readSides();
      const g = KGeo.sideLengthsLatLng(draft.corners.map(c => [c.lat, c.lng]));
      $('#gps-compare').innerHTML = '<div class="note"><b>GPS check</b> (rough): ' + SIDES.map((k, i) => sideName(k) + ' ≈ ' + g[i].toFixed(0) + ' m').join(' · ') + '. Your tape numbers should be close to these. A big difference usually means a corner was captured out of order.</div>';
    };
    el.querySelectorAll('[data-s]').forEach(i => i.oninput = compare);
    compare();
    if ($('#fill')) $('#fill').onclick = () => {
      const t = KGeo.sideLengthsLatLng(demoTruth), f = KGeo.makeFrame(demoTruth), xy = demoTruth.map(f.toXY);
      ['AB', 'BC', 'CD', 'DA'].forEach((k, i) => s[k] = t[i].toFixed(1));
      s.AC = Math.hypot(xy[0][0] - xy[2][0], xy[0][1] - xy[2][1]).toFixed(1);
      renderCapture();
    };
    $('#back').onclick = () => { readSides(); draft.step = 2; renderCapture(); };
    $('#next').onclick = () => { readSides(); draft.step = 4; renderCapture(); };
    return;
  }
  if (draft.step === 4) {
    const gps = draft.corners.map(c => [c.lat, c.lng]);
    const sides = {}; Object.keys(draft.sides).forEach(k => { const v = parseFloat(draft.sides[k]); if (v > 0) sides[k] = v; });
    const r = KGeo.fitPlot(gps, sides);
    draft.result = r;
    const accs = draft.corners.map(c => c.acc);
    el.innerHTML = stepsBar(4) + `
      <h2>Check the shape</h2>
      <p class="lead"><span style="color:var(--blue)">Blue dashed</span> = raw GPS. <b>White</b> = the plot reshaped to your tape sizes. This white outline is what buyers will see.</p>
      <div class="panel">
        ${r.ok ? '' : `<div class="err">${esc(r.error)}</div>`}
        ${r.ok ? `<div class="stats">
            <div class="stat"><b>${m2(r.area)}</b><span>Land size</span></div>
            <div class="stat"><b>±${Math.round(Math.max(...accs))} m</b><span>GPS position (phone estimate)</span></div>
            <div class="stat"><b>${r.method === 'tape+diagonal' ? 'Exact' : r.method === 'tape' ? 'Good' : 'Rough'}</b><span>Shape (${r.method === 'tape+diagonal' ? 'tape + diagonal' : r.method === 'tape' ? 'tape, no diagonal' : 'GPS only'})</span></div>
            <div class="stat"><b>${r.residuals.map(x => x.toFixed(1)).join(' / ')} m</b><span>Brick vs tape (A/B/C/D)</span></div>
          </div>` : ''}
        ${r.ok && r.warnings.length ? r.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join('') : ''}
        ${r.ok && !r.warnings.length ? '<div class="good">Looks right. The bricks match the tape sizes.</div>' : ''}
        <div class="mini-map" id="cap-map" style="height:360px"></div>
      </div>
      <div class="footer-nav"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="save" ${r.ok ? '' : 'disabled'}>Save plot</button></div>`;
    $('#back').onclick = () => { draft.step = 3; renderCapture(); };
    $('#save').onclick = savePlot;
    initCapMap(r);
  }
}

function renderBricks() {
  const box = $('#bricks'); if (!box) return;
  box.innerHTML = draft.corners.map((c, i) => {
    const L_ = 'ABCD'[i];
    const isCap = capturing && capturing.i === i;
    let info;
    if (isCap) {
      const n = capturing.samples.length, left = Math.max(0, Math.ceil((capturing.dur - (Date.now() - capturing.start)) / 1000));
      const a = capturing.samples.length ? Math.round(median(capturing.samples.map(s => s.acc))) : null;
      info = `<b>Capturing… ${left}s</b><span>${n} readings${a != null ? ' · ±' + a + ' m' : ' · waiting for GPS'}</span><div class="bar"><i style="width:${Math.min(100, (Date.now() - capturing.start) / capturing.dur * 100)}%"></i></div>`;
    } else if (c) info = `<b>Brick ${L_} captured</b><span>±${Math.round(c.acc)} m · ${c.n} readings${c.photo ? ' · photo ✓' : ''}</span>`;
    else info = `<b>Brick ${L_}</b><span>${i === 0 ? 'Start at a road corner' : 'Walk to the next brick'}</span>`;
    return `<div class="brick ${c ? 'done' : ''}"><div class="letter">${L_}</div><div class="info">${info}</div>
      <div class="acts">${isCap ? `<button class="btn ghost" data-stop="${i}">Done</button>` :
        `<button class="btn ${c ? 'ghost' : 'primary'}" data-cap="${i}" ${capturing ? 'disabled' : ''}>${c ? 'Redo' : 'Capture'}</button>`}
        <label class="btn ghost" title="Photo of the brick">📷<input type="file" accept="image/*" capture="environment" data-photo="${i}" hidden></label></div></div>`;
  }).join('');
  box.querySelectorAll('[data-cap]').forEach(b => b.onclick = () => startCapture(+b.dataset.cap));
  box.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => finishCapture());
  box.querySelectorAll('[data-photo]').forEach(inp => inp.onchange = () => addPhoto(+inp.dataset.photo, inp.files[0]));
}

const median = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };

function startCapture(i) {
  stopCapture(true);
  capturing = { i, samples: [], start: Date.now(), dur: gpsMode === 'demo' ? 6000 : 45000, watch: null, timer: null };
  if (gpsMode === 'real') {
    if (!navigator.geolocation) { $('#gps-msg').innerHTML = '<div class="err">This phone/browser has no GPS access.</div>'; capturing = null; return; }
    capturing.watch = navigator.geolocation.watchPosition(pos => {
      if (!capturing) return;
      capturing.samples.push({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy || 50 });
    }, err => {
      const msg = err.code === 1 ? 'Location is blocked. Allow location for this site in your phone settings, or practise with Demo GPS.' : 'GPS error: ' + err.message;
      $('#gps-msg').innerHTML = `<div class="err">${esc(msg)}</div>`;
      stopCapture(true); renderBricks();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  } else {
    if (!demoTruth) makeDemoTruth();
    const t = demoTruth[i];
    const f = KGeo.makeFrame([t]); const bias = [(Math.random() - .5) * 3, (Math.random() - .5) * 3];
    capturing.watch = setInterval(() => {
      const g = () => Math.sqrt(-2 * Math.log(Math.random() || 1e-9)) * Math.cos(2 * Math.PI * Math.random());
      const q = f.toLL([bias[0] + g() * 3.5, bias[1] + g() * 3.5]);
      capturing.samples.push({ lat: q[0], lng: q[1], acc: 3 + Math.random() * 3 });
    }, 200);
  }
  capturing.timer = setInterval(() => {
    if (!capturing) return;
    if (Date.now() - capturing.start >= capturing.dur) finishCapture(); else renderBricks();
  }, 500);
  renderBricks();
}

function finishCapture() {
  if (!capturing) return;
  const { i, samples } = capturing;
  stopCapture(true);
  if (!samples.length) { toast('No GPS readings yet. Go outside, wait for GPS, and try again.'); renderBricks(); return; }
  let good = samples.filter(s => s.acc <= 25); if (good.length < 3) good = samples;
  let W = 0, la = 0, ln = 0;
  good.forEach(s => { const w = 1 / Math.max(1, s.acc * s.acc); W += w; la += s.lat * w; ln += s.lng * w; });
  const prev = draft.corners[i];
  draft.corners[i] = { lat: la / W, lng: ln / W, acc: median(good.map(s => s.acc)), n: good.length, photo: prev ? prev.photo : null };
  renderBricks(); drawCapMap();
}

function stopCapture(silent) {
  if (!capturing) return;
  if (gpsMode === 'real' && capturing.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(capturing.watch);
  else clearInterval(capturing.watch);
  clearInterval(capturing.timer);
  capturing = null;
}

function makeDemoTruth() {
  const k = Math.cos(JIJIGA[0] * Math.PI / 180), o = [9.3462, 42.7865];
  const w = 18 + Math.random() * 8, d = 24 + Math.random() * 10, a = Math.random() * 1.2 - .6;
  const loc = [[0, 0], [w, 0], [w + 1.2, d + .8], [-.6, d]];
  demoTruth = loc.map(p => [o[0] + (p[0] * Math.sin(a) + p[1] * Math.cos(a)) / 110540, o[1] + (p[0] * Math.cos(a) - p[1] * Math.sin(a)) / (111320 * k)]);
}

function addPhoto(i, file) {
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const s = Math.min(1, 720 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', .7);
    URL.revokeObjectURL(url);
    if (!draft.corners[i]) draft.corners[i] = { lat: null, lng: null, acc: null, n: 0, photo: data, pending: true };
    else draft.corners[i].photo = data;
    if (draft.corners[i].pending) { draft.corners[i] = null; toast('Capture the GPS first, then add the photo.'); }
    else toast('Photo saved for brick ' + 'ABCD'[i]);
    renderBricks();
  };
  img.src = url;
}

let capBase = null;
function initCapMap(result) {
  const el = $('#cap-map'); if (!el) return;
  el.insertAdjacentHTML('beforebegin', '<div class="chips" id="cap-layers">' + Object.keys(MAP_NAMES).map(k => `<button class="chip" data-cl="${k}">${MAP_NAMES[k]}</button>`).join('') + '</div>');
  capMap = L.map(el, { zoomControl: true, attributionControl: false }).setView([9.3462, 42.7865], 17);
  capBase = null;
  setCapBase(mapChoice);
  document.querySelectorAll('#cap-layers [data-cl]').forEach(b => b.onclick = () => setCapBase(b.dataset.cl));
  capLayer = L.layerGroup().addTo(capMap);
  drawCapMap(result);
}
async function setCapBase(name) {
  const m = capMap; if (!m) return;
  const l = await makeBase(name);
  if (capMap !== m) return;                          // user left this step meanwhile
  if (!l) return setCapBase('sat');
  if (capBase) m.removeLayer(capBase);
  capBase = l.addTo(m); mapChoice = name;
  document.querySelectorAll('#cap-layers [data-cl]').forEach(x => x.classList.toggle('on', x.dataset.cl === name));
}

function drawCapMap(result) {
  if (!capMap) return;
  capLayer.clearLayers();
  const pts = [];
  draft.corners.forEach((c, i) => {
    if (!c || c.lat == null) return;
    const ll = [c.lat, c.lng]; pts.push(ll);
    L.circle(ll, { radius: c.acc || 3, color: '#60a5fa', weight: 1, fillOpacity: .12 }).addTo(capLayer);
    L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#22c55e', fillOpacity: 1 })
      .bindTooltip('ABCD'[i], { permanent: true, direction: 'top', className: 'price-tag' }).addTo(capLayer);
  });
  if (pts.length >= 2) L.polyline(pts.length === 4 ? pts.concat([pts[0]]) : pts, { color: '#60a5fa', weight: 2, dashArray: '6 6' }).addTo(capLayer);
  if (result && result.ok) {
    L.polygon(result.fitted, { color: '#fff', weight: 3, fillColor: '#fff', fillOpacity: .15 }).addTo(capLayer);
    if (draft.road) { const i = SIDES.indexOf(draft.road); L.polyline([result.fitted[i], result.fitted[(i + 1) % 4]], { color: '#e3b56b', weight: 5 }).addTo(capLayer); }
  }
  if (pts.length) capMap.fitBounds(L.latLngBounds(pts).pad(.6), { maxZoom: 19 });
  else if (gpsMode === 'demo') { if (!demoTruth) makeDemoTruth(); capMap.setView(demoTruth[0], 18); }
}

function savePlot() {
  const r = draft.result; if (!r || !r.ok) return;
  const sides = {}; Object.keys(draft.sides).forEach(k => { const v = parseFloat(draft.sides[k]); if (v > 0) sides[k] = v; });
  const p = {
    id: 'p' + Date.now().toString(36), demo: false, area: draft.area, title: draft.title || 'Plot ' + (plots.filter(x => !x.demo).length + 1),
    price: Math.round(+draft.price), status: 'sale', owner: draft.owner, phone: draft.phone, road: draft.road, notes: draft.notes,
    corners: draft.corners.map(c => ({ lat: c.lat, lng: c.lng, acc: c.acc, n: c.n, photo: c.photo })),
    sides, fitted: r.fitted, areaM2: r.area, method: r.method, rms: r.rms, created: Date.now(), practice: gpsMode === 'demo'
  };
  plots.push(p); save();
  draft = blankDraft(); demoTruth = null;
  filt.area = ''; filt.budget = 0; filt.size = 0;
  $('#f-budget').value = ''; $('#f-size').value = '';
  show('map'); select(p.id, true);
  toast('Plot saved and on the map');
}

/* =====================================================================
   TV PRESENTATION — for showing land to buyers on a big screen.
   Hides all agent/admin things; never shows seller names or phones.
   ===================================================================== */
let tvOn = false, tvSaved = null, tvIdleTimer = null, tvFullByUs = false;
const tvLayer = L.layerGroup();
const tvPad = () => isPhone() ? { paddingTopLeft: [30, 110], paddingBottomRight: [30, 260] } : { paddingTopLeft: [320, 110], paddingBottomRight: [60, 220] };

function enterTv() {
  tvSaved = { filt: Object.assign({}, filt), center: map.getCenter(), zoom: map.getZoom(), selected, view: currentView, layer: mapChoice };
  tvOn = true;
  show('map');
  document.body.classList.add('tv');
  document.body.classList.remove('detail-open');
  tvLayer.addTo(map);
  const el = document.documentElement;
  if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().then(() => { tvFullByUs = true; }).catch(() => {});
  setTimeout(() => { map.invalidateSize(); tvRender(true); }, 120);
  tvWake();
}

function exitTv() {
  if (!tvOn) return;
  tvOn = false;
  document.body.classList.remove('tv', 'spot', 'idle', 'panel-open');
  map.removeLayer(tvLayer); tvLayer.clearLayers();
  clearTimeout(tvIdleTimer);
  if (document.fullscreenElement && document.exitFullscreen) { tvFullByUs = false; document.exitFullscreen().catch(() => {}); }
  const sv = tvSaved; tvSaved = null;
  if (sv) {
    Object.assign(filt, sv.filt);
    $('#f-budget').value = filt.budget || ''; $('#f-size').value = filt.size || ''; $('#f-sold').checked = filt.sold;
    selected = sv.selected;
    if (sv.layer !== mapChoice) switchLayer(sv.layer);
  }
  setTimeout(() => {
    map.invalidateSize();
    if (sv) map.setView(sv.center, sv.zoom, { animate: false });
    renderMap();
    const p = plots.find(x => x.id === selected);
    if (p) select(p.id, false); else $('#detail').classList.add('hidden');
    if (sv && sv.view !== 'map') show(sv.view);
  }, 120);
}

$('#tv-btn').onclick = enterTv;
$('#tv-exit').onclick = exitTv;
$('#tv-full').onclick = () => {
  if (document.fullscreenElement) { tvFullByUs = false; document.exitFullscreen().catch(() => {}); }
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().then(() => { tvFullByUs = true; }).catch(() => toast('Full screen is not allowed here'));
};
// Esc leaves full screen first (browser rule); treat that as "exit TV mode"
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && tvOn && tvFullByUs) { tvFullByUs = false; exitTv(); } });

// controls fade after 4 s without mouse / touch
function tvWake() {
  if (!tvOn) return;
  document.body.classList.remove('idle');
  clearTimeout(tvIdleTimer);
  tvIdleTimer = setTimeout(() => { if (tvOn && !document.activeElement.matches('input')) document.body.classList.add('idle'); }, 4000);
}
['mousemove', 'mousedown', 'touchstart', 'keydown', 'wheel'].forEach(ev => document.addEventListener(ev, tvWake, { passive: true }));

document.addEventListener('keydown', e => {
  if (!tvOn || e.target.matches('input, textarea, select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); tvStep(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); tvStep(-1); }
  else if (e.key === 'Escape') exitTv();
  else if (e.key.toLowerCase() === 'm') { const order = ['sat', 'groad', 'ghyb']; tvMap(order[(order.indexOf(mapChoice) + 1) % 3]); }
});

function tvList() { return visiblePlots(); }

function tvStep(dir) {
  const list = tvList(); if (!list.length) return;
  let i = list.findIndex(p => p.id === selected);
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : (i + dir + list.length) % list.length;
  select(list[i].id, true);
  tvUpdateTop();
}
$('#tv-prev').onclick = () => tvStep(-1);
$('#tv-next').onclick = () => tvStep(1);
$('#tv-filters').onclick = () => document.body.classList.toggle('panel-open');

async function tvMap(name) { await switchLayer(name); tvUpdateTop(); }
document.querySelectorAll('#tv-maps button').forEach(b => b.onclick = () => tvMap(b.dataset.layer));

function tvUpdateTop() {
  const list = tvList(), i = list.findIndex(p => p.id === selected);
