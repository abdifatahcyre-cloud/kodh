    `<small>${esc(filt.area || 'All areas')}${range ? ' · ' + range : ''}</small>`;
  document.querySelectorAll('#tv-maps button').forEach(b => b.classList.toggle('on', b.dataset.layer === mapChoice));
}

function tvRender(fit) {
  const areas = [...new Set(plots.map(p => p.area).filter(Boolean))].sort();
  $('#tv-areas').innerHTML = ['', ...areas].map(a => `<button class="chip ${filt.area === a ? 'on' : ''}" data-a="${esc(a)}">${a ? esc(a) : 'All'}</button>`).join('');
  $('#tv-budgets').innerHTML = [0, ...BUDGETS].map(b => `<button class="chip ${filt.budget === b ? 'on' : ''}" data-b="${b}">${b ? '≤ ' + shortBirr(b) : 'Any'}</button>`).join('');
  $('#tv-sold').checked = filt.sold;
  if (selected && !tvList().some(p => p.id === selected)) selected = null;
  renderMap(fit);
  const p = plots.find(x => x.id === selected);
  if (p) { Object.keys(shapes).forEach(k => shapes[k].poly.setStyle(styleFor(plots.find(x => x.id === k), k === selected))); renderTvCard(p); }
  else renderTvCard(null);
  tvUpdateTop();
}
$('#tv-areas').onclick = e => { const c = e.target.closest('[data-a]'); if (!c) return; filt.area = c.dataset.a; selected = null; tvRender(true); };
$('#tv-budgets').onclick = e => { const c = e.target.closest('[data-b]'); if (!c) return; filt.budget = +c.dataset.b; selected = null; tvRender(true); };
$('#tv-sold').onchange = e => { filt.sold = e.target.checked; tvRender(false); };
attachSearch($('#tv-place'), $('#tv-presults'), () => $('#tv-place').blur());

// side lengths written on the plot
function tvDrawLengths(p) {
  tvLayer.clearLayers();
  if (!p) return;
  const f = KGeo.makeFrame(p.fitted), xy = p.fitted.map(f.toXY);
  const c = xy.reduce((a, q) => [a[0] + q[0] / 4, a[1] + q[1] / 4], [0, 0]);
  const calc = KGeo.sideLengthsLatLng(p.fitted);
  SIDES.forEach((k, i) => {
    const a = xy[i], b = xy[(i + 1) % 4];
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const d = Math.hypot(m[0] - c[0], m[1] - c[1]) || 1;
    const out = [m[0] + (m[0] - c[0]) / d * 3.5, m[1] + (m[1] - c[1]) / d * 3.5];   // 3.5 m outside the edge
    const len = (p.sides && p.sides[k]) || calc[i];
    const isRoad = p.road === k;
    L.marker(f.toLL(out), { interactive: false, keyboard: false,
      icon: L.divIcon({ className: 'pl-icon', iconSize: [0, 0], html: `<div class="tv-len ${isRoad ? 'road' : ''}">${len.toFixed(1)} m${isRoad ? ' · ROAD' : ''}</div>` }) }).addTo(tvLayer);
  });
}

function renderTvCard(p) {
  const card = $('#tv-card');
  document.body.classList.toggle('spot', !!p);
  updateTags();
  tvDrawLengths(p);
  if (!p) {
    card.className = 'tv-only empty';
    card.innerHTML = 'Tap a plot, or press ▶ to start the tour';
    return;
  }
  card.className = 'tv-only';
  const photos = p.corners.map((x, i) => x.photo ? `<div data-ph="${i}" style="background-image:url(${x.photo})"><b>${'ABCD'[i]}</b></div>` : '').join('');
  card.innerHTML = `
    <div class="main">
      <div class="price">${fmtBirr(p.price)}</div>
      <div class="where">${esc(p.title)} · ${esc(p.area)}, Jijiga ${p.status !== 'sale' ? `<span class="pill ${p.status}" style="margin-left:8px">${STATUS_TEXT[p.status]}</span>` : ''}</div>
      <div><a class="tvb" style="font-size:14px;padding:7px 12px;text-decoration:none" target="_blank" rel="noopener" href="${earthUrl(plotCenter(p))}">3D view (Google Earth)</a></div>
    </div>
    <div class="facts">
      <div><b>${m2(p.areaM2)}</b><span>Land size</span></div>
      <div><b>${dims(p) || '—'}</b><span>About</span></div>
      <div><b>${Math.round(p.price / p.areaM2).toLocaleString('en-US')} Br</b><span>Per m²</span></div>
      <div><b>${p.road ? 'Side ' + sideName(p.road) : 'None'}</b><span>Faces road</span></div>
    </div>
    ${photos ? `<div class="ph">${photos}</div>` : ''}`;
  card.querySelectorAll('[data-ph]').forEach(d => d.onclick = () => {
    const i = +d.dataset.ph, lb = document.createElement('div');
    lb.id = 'tv-light'; lb.innerHTML = `<b>Corner ${'ABCD'[i]}</b><img src="${p.corners[i].photo}" alt="Corner ${'ABCD'[i]}">`;
    lb.onclick = () => lb.remove(); document.body.appendChild(lb);
  });
}
// plot clicks while in TV mode
L.DomEvent.disableClickPropagation($('#tv-top')); L.DomEvent.disableClickPropagation($('#tv-panel')); L.DomEvent.disableClickPropagation($('#tv-card'));
L.DomEvent.disableScrollPropagation($('#tv-panel'));
map.on('click', () => { if (tvOn && selected && !addingPlace) { selected = null; tvRender(false); } });

/* ---------------- start ---------------- */
renderMap(true);
renderPlaces();
if (isPhone()) setSheet(true);
</script>
