    </div>`;
  d.querySelector('.close').onclick = () => { d.classList.add('hidden'); document.body.classList.remove('detail-open'); selected = null; renderMap(); };
  d.querySelector('#d-zoom').onclick = () => map.flyToBounds(L.latLngBounds(p.fitted), Object.assign({ maxZoom: 20 }, flyPad()));
  d.querySelector('#d-status').onchange = e => { p.status = e.target.value; save(); renderMap(); renderDetail(p); toast('Marked as ' + STATUS_TEXT[p.status]); };
}

/* =====================================================================
   PLACE NAMES (KODH's own labels: mosques, schools, markets, areas…)
   ===================================================================== */
const PSTORE = 'kodh.places.v1';
const PTYPES = { mosque: ['Mosque', '#22c55e'], school: ['School', '#60a5fa'], market: ['Market / shops', '#f5a524'],
  health: ['Hospital / clinic', '#ef4444'], hotel: ['Hotel / restaurant', '#c084fc'], office: ['Office / government', '#94a3b8'],
  road: ['Road name', '#e3b56b'], area: ['Area / neighbourhood', '#f3d39c'], other: ['Other', '#ffffff'] };
let places = [];
try { places = JSON.parse(localStorage.getItem(PSTORE) || '[]'); } catch (e) { places = []; }
const savePlaces = () => { try { localStorage.setItem(PSTORE, JSON.stringify(places)); } catch (e) { toast('Could not save on this device.'); } };
const placeLayer = L.layerGroup().addTo(map);
let addingPlace = false;

function renderPlaces() {
  placeLayer.clearLayers();
  const z = map.getZoom();
  places.forEach(pl => {
    const isArea = pl.type === 'area';
    if (z < (isArea ? 13 : 15)) return;
    const col = (PTYPES[pl.type] || PTYPES.other)[1];
    const icon = L.divIcon({ className: 'pl-icon', iconSize: [0, 0],
      html: `<div class="pl ${isArea ? 'area' : ''}"><i style="background:${col}"></i>${esc(pl.name)}</div>` });
    L.marker([pl.lat, pl.lng], { icon, keyboard: false, zIndexOffset: isArea ? -100 : 100 })
      .on('click', e => { L.DomEvent.stopPropagation(e); if (measuring) { measureAdd(L.latLng(pl.lat, pl.lng), true); return; } openPlaceSheet(pl); }).addTo(placeLayer);
  });
}
map.on('zoomend', renderPlaces);
// clicks on panels and buttons over the map must not count as map taps
['.map-tools', '#add-banner', '#place-sheet', '#detail', '#measure-bar'].forEach(sel => { const el = $(sel); if (el) { L.DomEvent.disableClickPropagation(el); L.DomEvent.disableScrollPropagation(el); } });

function setAdding(on) {
  if (on && measuring) measureStop();
  addingPlace = on;
  $('#map').classList.toggle('adding', on);
  $('#add-banner').classList.toggle('hidden', !on);
  $('#add-place').classList.toggle('on', on); if (on) showLayerMenu(false);
  if (on) { $('#detail').classList.add('hidden'); document.body.classList.remove('detail-open'); if (isPhone()) setSheet(true); }
}
$('#add-place').onclick = () => setAdding(!addingPlace);
$('#add-cancel').onclick = () => setAdding(false);
map.on('click', e => { if (measuring) { measureAdd(e.latlng); return; } if (addingPlace) placeAt(e.latlng); });

function placeAt(latlng) {
  setAdding(false);
  if (map.getZoom() < 16) map.setView(latlng, 17);
  openPlaceSheet({ id: null, name: '', type: 'mosque', lat: latlng.lat, lng: latlng.lng });
}

function openPlaceSheet(pl) {
  const sh = $('#place-sheet'); sh.classList.remove('hidden');
  const isNew = !pl.id; let type = pl.type;
  sh.innerHTML = `<h3>${isNew ? 'Name this place' : 'Place name'}</h3>
    <input type="text" id="pl-name" placeholder="e.g. Al-Furqan Mosque" value="${esc(pl.name)}" maxlength="60">
    <div class="types">${Object.keys(PTYPES).map(k => `<button class="chip ${k === type ? 'on' : ''}" data-t="${k}">${PTYPES[k][0]}</button>`).join('')}</div>
    <div class="btns">${isNew ? '' : '<button class="btn danger" id="pl-del">Delete</button>'}<button class="btn ghost" id="pl-cancel">Cancel</button><button class="btn primary" id="pl-save">Save</button></div>`;
  sh.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { type = b.dataset.t; sh.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); });
  const close = () => sh.classList.add('hidden');
  sh.querySelector('#pl-cancel').onclick = close;
  sh.querySelector('#pl-save').onclick = () => {
    const name = sh.querySelector('#pl-name').value.trim();
    if (!name) { toast('Type the name first'); return; }
    if (isNew) places.push({ id: 'pl' + Date.now().toString(36), name, type, lat: pl.lat, lng: pl.lng, created: Date.now() });
    else Object.assign(places.find(x => x.id === pl.id), { name, type });
    savePlaces(); renderPlaces(); close(); toast(isNew ? 'Place added' : 'Place updated');
  };
  if (!isNew) {
    const del = sh.querySelector('#pl-del');
    del.onclick = () => {
      if (!del.dataset.armed) { del.dataset.armed = 1; del.textContent = 'Sure?'; return; }
      places = places.filter(x => x.id !== pl.id); savePlaces(); renderPlaces(); close(); toast('Place deleted');
    };
  }
  setTimeout(() => sh.querySelector('#pl-name').focus(), 50);
}

// search place names (also matches plot titles and areas)
/* Search: KODH's own place names, plus Google places when "+ Google" is on
   (it turns on by itself when a Google map is shown). */
let gSearch = false;
const searchLayer = L.layerGroup().addTo(map);
function setGSearch(on) { gSearch = on; document.querySelectorAll('.gtoggle').forEach(b => { b.classList.toggle('on', on); b.textContent = on ? '✓ Google' : '+ Google'; }); }
document.querySelectorAll('.gtoggle').forEach(b => b.onclick = () => {
  setGSearch(!gSearch);
  const inp = b.parentElement.querySelector('input'); if (inp.value.trim()) inp.dispatchEvent(new Event('input')); inp.focus();
});
function searchPin(ll, name) {
  searchLayer.clearLayers();
  L.marker(ll, { keyboard: false, zIndexOffset: 2000, icon: L.divIcon({ className: 'pin-icon', iconSize: [30, 40], iconAnchor: [15, 40],
    html: `<div class="pin search"><span>${esc(name)}</span><svg viewBox="0 0 30 40"><path d="M15 39C15 39 2 23.5 2 14a13 13 0 0 1 26 0c0 9.5-13 25-13 25z" fill="#2563eb" stroke="#fff" stroke-width="2.2"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg></div>` }) })
    .on('click', () => searchLayer.clearLayers()).addTo(searchLayer);
}
function attachSearch(input, box, done) {
  let timer = null, seq = 0, token = null;
  input.oninput = () => {
    const q = input.value.trim(), ql = q.toLowerCase();
    if (!q) { box.classList.add('hidden'); return; }
    const mine = places.filter(pl => pl.name.toLowerCase().includes(ql)).slice(0, 6);
    let html = mine.map(pl => `<div data-id="${pl.id}">${esc(pl.name)}<small>${(PTYPES[pl.type] || PTYPES.other)[0]}</small></div>`).join('');
    clearTimeout(timer); const my = ++seq;
    if (!gSearch) {
      box.innerHTML = html || '<div class="sr-muted">None of your place names match. Tap “+ Google” to search Google too.</div>';
      box.classList.remove('hidden'); return;
    }
    box.innerHTML = html + '<div class="sr-muted g-wait">Searching Google…</div>';
    box.classList.remove('hidden');
    timer = setTimeout(async () => {
      let extra;
      try {
        await loadGoogle();
        const { AutocompleteSuggestion, AutocompleteSessionToken } = await google.maps.importLibrary('places');
        token = token || new AutocompleteSessionToken();
        const res = await AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: q, sessionToken: token,
          locationBias: { center: { lat: JIJIGA[0], lng: JIJIGA[1] }, radius: 30000 }, includedRegionCodes: ['et'] });
        if (my !== seq) return;
        const preds = (res.suggestions || []).map(x => x.placePrediction).filter(Boolean).slice(0, 6);
        box._preds = preds;
        extra = preds.length ? preds.map((pp, i) => `<div data-g="${i}">${esc(pp.text.text)}<small>Google</small></div>`).join('') : '<div class="sr-muted">Google found nothing with that name.</div>';
      } catch (err) {
        if (my !== seq) return;
        console.log('Google search error', err);
        extra = '<div class="sr-muted">Google search is not available right now.</div>';
      }
      const w = box.querySelector('.g-wait'); if (w) w.remove();
      box.insertAdjacentHTML('beforeend', extra);
    }, 350);
  };
  box.onclick = async e => {
    const d = e.target.closest('[data-id],[data-g]'); if (!d) return;
    box.classList.add('hidden'); done();
    if (d.dataset.id) {
      const pl = places.find(x => x.id === d.dataset.id); input.value = pl.name;
      searchLayer.clearLayers(); map.flyTo([pl.lat, pl.lng], 17, { duration: .8 }); return;
    }
    const pred = (box._preds || [])[+d.dataset.g]; if (!pred) return;
    input.value = pred.text.text;
    try {
      const place = pred.toPlace();
      await place.fetchFields({ fields: ['location', 'displayName'] });
      token = null;
      const ll = [place.location.lat(), place.location.lng()];
      searchPin(ll, place.displayName || input.value);
      map.flyTo(ll, 17, { duration: .9 });
    } catch (err) { console.log(err); toast('Could not open that Google place'); }
  };
}
attachSearch($('#f-place'), $('#place-results'), () => { if (isPhone()) setSheet(true); });

/* =====================================================================
   ADD PLOT (capture)
   ===================================================================== */
const blankDraft = () => ({ step: 1, title: '', area: '', price: '', owner: '', phone: '', notes: '', road: 'AB',
  corners: [null, null, null, null], sides: { AB: '', BC: '', CD: '', DA: '', AC: '' } });
let draft = blankDraft();
let gpsMode = (navigator.geolocation && window.isSecureContext) ? 'real' : 'demo';
let capturing = null;   // {i, timer, watch, samples, start}
let capMap = null, capLayer = null;
let demoTruth = null;   // hidden true corners for demo GPS

function stepsBar(n) { return '<div class="steps">' + [1, 2, 3, 4].map(i => `<div class="step ${i <= n ? 'on' : ''}"></div>`).join('') + '</div>'; }

function renderCapture() {
  const el = $('#cap');
  stopCapture(true);
  if (capMap) { capMap.remove(); capMap = null; }
  if (draft.step === 1) {
    const areas = [...new Set(plots.map(p => p.area))].sort();
    el.innerHTML = liveBanner() + stepsBar(1) + `
      <h2>New plot · details</h2>
      <p class="lead">Fill this in with the seller. Next, you'll walk to each corner brick.</p>
      <div class="panel">
        <div class="grid2">
          <div class="field"><label>Area</label><input type="text" id="c-area" list="areas" placeholder="e.g. North" value="${esc(draft.area)}">
            <datalist id="areas">${areas.map(a => `<option value="${esc(a)}">`).join('')}</datalist></div>
          <div class="field"><label>Asking price (Birr)</label><input type="number" inputmode="numeric" id="c-price" placeholder="2000000" value="${esc(draft.price)}"></div>
          <div class="field"><label>Owner name (on the bricks)</label><input type="text" id="c-owner" value="${esc(draft.owner)}"></div>
          <div class="field"><label>Owner phone</label><input type="tel" id="c-phone" value="${esc(draft.phone)}"></div>
          <div class="field"><label>Plot name (optional)</label><input type="text" id="c-title" placeholder="e.g. Corner plot near school" value="${esc(draft.title)}"></div>
          <div class="field"><label>Which side faces the road?</label>
            <select id="c-road">${['AB', 'BC', 'CD', 'DA'].map(k => `<option value="${k}" ${draft.road === k ? 'selected' : ''}>Side ${sideName(k)}</option>`).join('')}<option value="" ${!draft.road ? 'selected' : ''}>No road</option></select></div>
        </div>
        <div class="field"><label>Notes</label><textarea id="c-notes" rows="2" placeholder="Water, electricity, neighbours, documents…">${esc(draft.notes)}</textarea></div>
        <div class="diagram">${cornerDiagram()}<div class="note">Name the corners <b>A, B, C, D</b> in order as you walk around the plot. Start with <b>A</b> at a corner on the road, so <b>A–B</b> is the road side.</div></div>
      </div>
      <div class="footer-nav"><button class="btn primary" id="next">Next: corner bricks →</button></div>`;
    $('#next').onclick = () => {
      draft.area = $('#c-area').value.trim(); draft.price = $('#c-price').value; draft.owner = $('#c-owner').value.trim();
      draft.phone = $('#c-phone').value.trim(); draft.title = $('#c-title').value.trim(); draft.road = $('#c-road').value; draft.notes = $('#c-notes').value.trim();
      if (!draft.area || !(+draft.price > 0)) { toast('Add the area and the price first.'); return; }
      livePub({ t: 'details', area: draft.area, price: +draft.price, road: draft.road });
      draft.step = 2; renderCapture();
    };
    return;
  }
  if (draft.step === 2) {
    el.innerHTML = liveBanner() + stepsBar(2) + `
      <h2>Corner bricks</h2>
      <p class="lead">Stand right on each brick and tap <b>Capture</b>. Keep still for the countdown; the phone takes many GPS readings and averages them. Take a photo of the brick with the name showing.</p>
      <div class="panel">
        <div class="mode"><button data-m="real" class="${gpsMode === 'real' ? 'on' : ''}">Real GPS</button><button data-m="demo" class="${gpsMode === 'demo' ? 'on' : ''}">Demo GPS (practice)</button></div>
        <div id="gps-msg"></div>
        <div class="bricks" id="bricks"></div>
        <div class="mini-map" id="cap-map"></div>
      </div>
      <div class="footer-nav"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="next">Next: tape sizes →</button></div>`;
    el.querySelectorAll('.mode button').forEach(b => b.onclick = () => { gpsMode = b.dataset.m; renderCapture(); });
    $('#back').onclick = () => { draft.step = 1; renderCapture(); };
    $('#next').onclick = () => {
      if (draft.corners.some(c => !c)) { toast('Capture all 4 bricks first.'); return; }
      draft.step = 3; renderCapture();
    };
    if (gpsMode === 'real' && !window.isSecureContext) $('#gps-msg').innerHTML = '<div class="err">Real GPS needs the page opened over https.</div>';
    if (gpsMode === 'demo') $('#gps-msg').innerHTML = '<div class="note">Practice mode: pretends you are walking around a plot in Jijiga, with realistic GPS errors. Use <b>Real GPS</b> on site.</div>';
    renderBricks();
    initCapMap();
    return;
  }
  if (draft.step === 3) {
    const s = draft.sides;
    el.innerHTML = stepsBar(3) + `
      <h2>Tape sizes</h2>
      <p class="lead">Measure brick to brick with a tape, or copy the sizes from the sale agreement. The <b>diagonal A–C</b> locks the exact shape: please measure it.</p>
      <div class="panel">
        <div class="diagram">${cornerDiagram(true)}<div class="note">Sides go around the plot: A–B, B–C, C–D, D–A. The diagonal goes across, from brick A to brick C.</div></div>
        <div class="sizes">
          ${SIDES.map(k => `<div class="field"><label>Side ${sideName(k)}${draft.road === k ? ' (road)' : ''}</label><div class="unit"><input type="number" step="0.1" inputmode="decimal" data-s="${k}" value="${esc(s[k])}"></div></div>`).join('')}
          <div class="field diag"><label>Diagonal A–C (recommended)</label><div class="unit"><input type="number" step="0.1" inputmode="decimal" data-s="AC" value="${esc(s.AC)}"></div></div>
        </div>
        <div id="gps-compare"></div>
        ${gpsMode === 'demo' && demoTruth ? '<button class="btn ghost" id="fill">Fill practice tape sizes</button>' : ''}
      </div>
      <div class="footer-nav"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="next">Check the shape →</button></div>`;
    const readSides = () => el.querySelectorAll('[data-s]').forEach(i => { s[i.dataset.s] = i.value; });
    const compare = () => {
      readSides();
      const g = KGeo.sideLengthsLatLng(draft.corners.map(c => [c.lat, c.lng]));
      $('#gps-compare').innerHTML = '<div class="note"><b>GPS check</b> (rough): ' + SIDES.map((k, i) => sideName(k) + ' ≈ ' + g[i].toFixed(0) + ' m').join(' · ') + '. Your tape numbers should be close to these. A big difference usually means a corner was captured out of order.</div>';
    };
    el.querySelectorAll('[data-s]').forEach(i => i.oninput = compare);
    compare();
    if ($('#fill')) $('#fill').onclick = () => {
      const t = KGeo.sideLengthsLatLng(demoTruth), f = KGeo.makeFrame(demoTruth), xy = demoTruth.map(f.toXY);
      ['AB', 'BC', 'CD', 'DA'].forEach((k, i) => s[k] = t[i].toFixed(1));
      s.AC = Math.hypot(xy[0][0] - xy[2][0], xy[0][1] - xy[2][1]).toFixed(1);
      renderCapture();
    };
    $('#back').onclick = () => { readSides(); draft.step = 2; renderCapture(); };
    $('#next').onclick = () => {
      readSides();
      const nx = $('#next');
      if (!(parseFloat(s.AC) > 0) && !nx.dataset.armed) {
        nx.dataset.armed = 1; nx.textContent = 'Continue without diagonal';
        $('#gps-compare').insertAdjacentHTML('afterbegin', '<div class="warn" style="margin-bottom:10px"><b>Please measure the diagonal A–C.</b> Without it the corner angles are guessed from GPS, and the land size can be off by 5–10%.</div>');
        el.querySelector('[data-s="AC"]').focus();
        return;
      }
      livePub({ t: 'sides', sides: draft.sides }); draft.step = 4; renderCapture();
    };
    return;
  }
  if (draft.step === 4) {
    const gps = draft.corners.map(c => [c.lat, c.lng]);
    const sides = {}; Object.keys(draft.sides).forEach(k => { const v = parseFloat(draft.sides[k]); if (v > 0) sides[k] = v; });
    const r = KGeo.fitPlot(gps, sides);
    draft.result = r;
    livePub(r.ok ? { t: 'result', ok: true, fitted: r.fitted, area: r.area, residuals: r.residuals, method: r.method, warnings: r.warnings } : { t: 'result', ok: false, error: r.error });
    const accs = draft.corners.map(c => c.acc);
    el.innerHTML = stepsBar(4) + `
      <h2>Check the shape</h2>
      <p class="lead"><span style="color:var(--blue)">Blue dashed</span> = raw GPS. <b>White</b> = the plot reshaped to your tape sizes. This white outline is what buyers will see.</p>
      <div class="panel">
        ${r.ok ? '' : `<div class="err">${esc(r.error)}</div>`}
        ${r.ok ? `<div class="stats">
            <div class="stat"><b>${m2(r.area)}</b><span>Land size</span></div>
            <div class="stat"><b>±${Math.round(Math.max(...accs))} m</b><span>GPS position (phone estimate)</span></div>
            <div class="stat"><b>${r.method === 'tape+diagonal' ? 'Exact' : r.method === 'tape' ? 'Good' : 'Rough'}</b><span>Shape (${r.method === 'tape+diagonal' ? 'tape + diagonal' : r.method === 'tape' ? 'tape, no diagonal' : 'GPS only'})</span></div>
            <div class="stat"><b>${r.residuals.map(x => x.toFixed(1)).join(' / ')} m</b><span>Brick vs tape (A/B/C/D)</span></div>
          </div>` : ''}
        ${r.ok && r.warnings.length ? r.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join('') : ''}
        ${r.ok && !r.warnings.length ? '<div class="good">Looks right. The bricks match the tape sizes.</div>' : ''}
        <div class="mini-map" id="cap-map" style="height:360px"></div>
      </div>
      <div class="footer-nav"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="save" ${r.ok ? '' : 'disabled'}>Save plot</button></div>`;
    $('#back').onclick = () => { draft.step = 3; renderCapture(); };
    $('#save').onclick = savePlot;
    initCapMap(r);
  }
}

function cornerDiagram(withDiag) {
  return `<svg width="120" height="92" viewBox="0 0 120 92"><path d="M14 74 L104 78 L98 14 L20 18 Z" fill="rgba(255,255,255,.06)" stroke="#fff" stroke-width="2"/>
    <path d="M14 74 L104 78" stroke="#e3b56b" stroke-width="5"/>${withDiag ? '<path d="M14 74 L98 14" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3"/>' : ''}
    ${[[14, 74, 'A'], [104, 78, 'B'], [98, 14, 'C'], [20, 18, 'D']].map(([x, y, t]) => `<circle cx="${x}" cy="${y}" r="9" fill="#22c55e"/><text x="${x}" y="${y + 4}" font-size="11" font-weight="800" text-anchor="middle" fill="#06240f">${t}</text>`).join('')}
    <text x="58" y="90" font-size="9" fill="#e3b56b" text-anchor="middle" font-weight="700">ROAD</text></svg>`;
}

function renderBricks() {
  const box = $('#bricks'); if (!box) return;
  box.innerHTML = draft.corners.map((c, i) => {
    const L_ = 'ABCD'[i];
    const isCap = capturing && capturing.i === i;
    let info;
    if (isCap && !capturing.locked) {
      const waited = Math.round((Date.now() - capturing.asked) / 1000);
      info = `<b>Waiting for good GPS… ${waited}s</b><span>${capturing.warm != null ? 'Now ±' + Math.round(capturing.warm) + ' m, waiting for ±' + GOOD_FIX + ' m or better' : 'Searching for satellites'}. Stand still in the open.</span>`;
    } else if (isCap) {
      const n = capturing.samples.length, left = Math.max(0, Math.ceil((capturing.dur - (Date.now() - capturing.start)) / 1000));
      const a = capturing.samples.length ? Math.round(median(capturing.samples.map(s => s.acc))) : null;
      info = `<b>Capturing… ${left}s</b><span>${n} readings${a != null ? ' · ±' + a + ' m' : ' · waiting for GPS'}</span><div class="bar"><i style="width:${Math.min(100, (Date.now() - capturing.start) / capturing.dur * 100)}%"></i></div>`;
    } else if (c) info = `<b>Brick ${L_} captured</b><span>±${Math.round(c.acc)} m · ${c.n} readings${c.photo ? ' · photo ✓' : ''}</span>`;
    else info = `<b>Brick ${L_}</b><span>${i === 0 ? 'Start at a road corner' : 'Walk to the next brick'}</span>`;
    return `<div class="brick ${c ? 'done' : ''}"><div class="letter">${L_}</div><div class="info">${info}</div>
      <div class="acts">${isCap ? `<button class="btn ghost" data-stop="${i}">Done</button>` :
        `<button class="btn ${c ? 'ghost' : 'primary'}" data-cap="${i}" ${capturing ? 'disabled' : ''}>${c ? 'Redo' : 'Capture'}</button>`}
        <label class="btn ghost" title="Photo of the brick">📷<input type="file" accept="image/*" capture="environment" data-photo="${i}" hidden></label></div></div>`;
  }).join('');
  box.querySelectorAll('[data-cap]').forEach(b => b.onclick = () => startCapture(+b.dataset.cap));
  box.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => finishCapture());
  box.querySelectorAll('[data-photo]').forEach(inp => inp.onchange = () => addPhoto(+inp.dataset.photo, inp.files[0]));
}

const median = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };

const GOOD_FIX = 15;   // metres: wait for at least this accuracy before counting
function startCapture(i) {
  stopCapture(true);
  livePub({ t: 'cap_start', i, mode: gpsMode });
  startLiveDot();
  capturing = { i, samples: [], start: Date.now(), dur: gpsMode === 'demo' ? 6000 : 45000, watch: null, timer: null, locked: gpsMode === 'demo', asked: Date.now(), warm: null };
  if (gpsMode === 'real') {
    if (!navigator.geolocation) { $('#gps-msg').innerHTML = '<div class="err">This phone/browser has no GPS access.</div>'; capturing = null; return; }
    capturing.watch = navigator.geolocation.watchPosition(pos => {
      if (!capturing) return;
      const acc = pos.coords.accuracy || 50;
      // GPS often starts far off (e.g. ±80 m) and settles in a few seconds: start the countdown only once it is good
      if (!capturing.locked) {
        capturing.warm = acc;
        if (acc > GOOD_FIX && Date.now() - capturing.asked < 90000) return;
        capturing.locked = true; capturing.start = Date.now();
      }
      capturing.samples.push({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc });
    }, err => {
      if (err.code === 1) {          // permission blocked: nothing will come, stop
        $('#gps-msg').innerHTML = '<div class="err">Location is blocked. Allow location for this site in your phone settings, or practise with Demo GPS.</div>';
        stopCapture(true); renderBricks(); return;
      }
      // signal lost / slow for a moment: keep listening, it usually comes back
      $('#gps-msg').innerHTML = '<div class="warn">GPS signal is weak for a moment. Keep standing still in the open; it will continue by itself.</div>';
      setTimeout(() => { const m = $('#gps-msg'); if (m && /weak for a moment/.test(m.textContent)) m.innerHTML = ''; }, 8000);
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  } else {
    if (!demoTruth) makeDemoTruth();
    const t = demoTruth[i];
    const f = KGeo.makeFrame([t]); const bias = [(Math.random() - .5) * 3, (Math.random() - .5) * 3];
    capturing.watch = setInterval(() => {
      const g = () => Math.sqrt(-2 * Math.log(Math.random() || 1e-9)) * Math.cos(2 * Math.PI * Math.random());
      const q = f.toLL([bias[0] + g() * 3.5, bias[1] + g() * 3.5]);
      capturing.samples.push({ lat: q[0], lng: q[1], acc: 3 + Math.random() * 3 });
    }, 200);
  }
  capturing.timer = setInterval(() => {
    if (!capturing) return;
    if (capturing.locked && Date.now() - capturing.start >= capturing.dur) finishCapture(); else renderBricks();
  }, 500);
  renderBricks();
}

function finishCapture() {
  if (!capturing) return;
  const { i, samples } = capturing;
  stopCapture(true);
  if (!samples.length) { toast('No GPS readings yet. Go outside, wait for GPS, and try again.'); renderBricks(); return; }
  let good = samples.filter(s => s.acc <= 25); if (good.length < 3) good = samples;
  let W = 0, la = 0, ln = 0;
  good.forEach(s => { const w = 1 / Math.max(1, s.acc * s.acc); W += w; la += s.lat * w; ln += s.lng * w; });
  const prev = draft.corners[i];
  draft.corners[i] = { lat: la / W, lng: ln / W, acc: median(good.map(s => s.acc)), n: good.length, photo: prev ? prev.photo : null };
  { const c = draft.corners[i], step = Math.max(1, Math.ceil(samples.length / 140));
    livePub({ t: 'corner', i, lat: c.lat, lng: c.lng, acc: Math.round(c.acc * 10) / 10, n: c.n, total: samples.length, mode: gpsMode,
      raw: samples.filter((_, k) => k % step === 0).map(x => [Math.round((x.lat - c.lat) * 1e6), Math.round((x.lng - c.lng) * 1e6), Math.round(x.acc * 10) / 10]) }); }
  renderBricks(); drawCapMap();
}

function stopCapture(silent) {
  if (!capturing) return;
  if (gpsMode === 'real' && capturing.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(capturing.watch);
  else clearInterval(capturing.watch);
  clearInterval(capturing.timer);
  capturing = null;
}

function makeDemoTruth() {
  const k = Math.cos(JIJIGA[0] * Math.PI / 180), o = [9.3462, 42.7865];
  const w = 18 + Math.random() * 8, d = 24 + Math.random() * 10, a = Math.random() * 1.2 - .6;
  const loc = [[0, 0], [w, 0], [w + 1.2, d + .8], [-.6, d]];
  demoTruth = loc.map(p => [o[0] + (p[0] * Math.sin(a) + p[1] * Math.cos(a)) / 110540, o[1] + (p[0] * Math.cos(a) - p[1] * Math.sin(a)) / (111320 * k)]);
}

function addPhoto(i, file) {
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const s = Math.min(1, 720 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', .7);
    URL.revokeObjectURL(url);
    if (!draft.corners[i]) draft.corners[i] = { lat: null, lng: null, acc: null, n: 0, photo: data, pending: true };
    else draft.corners[i].photo = data;
    if (draft.corners[i].pending) { draft.corners[i] = null; toast('Capture the GPS first, then add the photo.'); }
    else { toast('Photo saved for brick ' + 'ABCD'[i]); livePhoto(i, data); }
    renderBricks();
  };
  img.src = url;
}

let capBase = null;
function initCapMap(result) {
  const el = $('#cap-map'); if (!el) return;
  el.insertAdjacentHTML('beforebegin', '<div class="chips" id="cap-layers">' + Object.keys(MAP_NAMES).map(k => `<button class="chip" data-cl="${k}">${MAP_NAMES[k]}</button>`).join('') + '</div>');
  capMap = L.map(el, { zoomControl: true, attributionControl: false }).setView([9.3462, 42.7865], 17);
  capBase = null;
  setCapBase(mapChoice);
  document.querySelectorAll('#cap-layers [data-cl]').forEach(b => b.onclick = () => setCapBase(b.dataset.cl));
  capLayer = L.layerGroup().addTo(capMap);
  drawCapMap(result);
}
async function setCapBase(name) {
  const m = capMap; if (!m) return;
  const l = await makeBase(name);
  if (capMap !== m) return;                          // user left this step meanwhile
  if (!l) return setCapBase('sat');
  if (capBase) m.removeLayer(capBase);

}

function drawCapMap(result) {
  if (!capMap) return;
  capLayer.clearLayers();
  const pts = [];
  draft.corners.forEach((c, i) => {
    if (!c || c.lat == null) return;
    const ll = [c.lat, c.lng]; pts.push(ll);
    L.circle(ll, { radius: c.acc || 3, color: '#60a5fa', weight: 1, fillOpacity: .12 }).addTo(capLayer);
    L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#22c55e', fillOpacity: 1 })
      .bindTooltip('ABCD'[i], { permanent: true, direction: 'top', className: 'price-tag' }).addTo(capLayer);
  });
  if (pts.length >= 2) L.polyline(pts.length === 4 ? pts.concat([pts[0]]) : pts, { color: '#60a5fa', weight: 2, dashArray: '6 6' }).addTo(capLayer);
  if (result && result.ok) {
    L.polygon(result.fitted, { color: '#fff', weight: 3, fillColor: '#fff', fillOpacity: .15 }).addTo(capLayer);
    if (draft.road) { const i = SIDES.indexOf(draft.road); L.polyline([result.fitted[i], result.fitted[(i + 1) % 4]], { color: '#e3b56b', weight: 5 }).addTo(capLayer); }
  }
  if (pts.length) capMap.fitBounds(L.latLngBounds(pts).pad(.6), { maxZoom: 19 });
  else if (gpsMode === 'demo') { if (!demoTruth) makeDemoTruth(); capMap.setView(demoTruth[0], 18); }
}

function savePlot() {
  const r = draft.result; if (!r || !r.ok) return;
  const sides = {}; Object.keys(draft.sides).forEach(k => { const v = parseFloat(draft.sides[k]); if (v > 0) sides[k] = v; });
  const p = {
    id: 'p' + Date.now().toString(36), demo: false, area: draft.area, title: draft.title || 'Plot ' + (plots.filter(x => !x.demo).length + 1),
    price: Math.round(+draft.price), status: 'sale', owner: draft.owner, phone: draft.phone, road: draft.road, notes: draft.notes,
    corners: draft.corners.map(c => ({ lat: c.lat, lng: c.lng, acc: c.acc, n: c.n, photo: c.photo })),
    sides, fitted: r.fitted, areaM2: r.area, method: r.method, rms: r.rms, created: Date.now(), practice: gpsMode === 'demo'
  };
  plots.push(p); save();

  filt.area = ''; filt.budget = 0; filt.size = 0;

}

/* =====================================================================
   MEASURE — tap points to measure real distances on the map.
   Snaps to plot corners/edges and to place names, so "corner to road"
   starts exactly at the corner. Distances use the Earth's real shape.
   ===================================================================== */
let measuring = false, mPts = [];          // mPts: [{ll, snap}]
const mLayer = L.layerGroup().addTo(map);
const fmtDist = d => d >= 1000 ? (d / 1000).toFixed(2) + ' km' : (d >= 100 ? d.toFixed(0) : d.toFixed(1)) + ' m';

function measureStart() {
  if (addingPlace) setAdding(false);
  measuring = true;
  $('#map').classList.add('measuring');
  $('#btn-measure').classList.add('on'); $('#tv-measure').classList.add('on');
  showLayerMenu && showLayerMenu(false);
  measureDraw();
}
function measureStop() {
  measuring = false;
  $('#map').classList.remove('measuring');
  $('#btn-measure').classList.remove('on'); $('#tv-measure').classList.remove('on');
  measureDraw();
}
function measureClear() { mPts = []; measureStop(); }
$('#btn-measure').onclick = () => measuring ? measureStop() : measureStart();
$('#tv-measure').onclick = () => measuring ? measureStop() : measureStart();

// snap a tapped point to the nearest plot corner (or edge) if it is close on screen
function measureSnap(ll) {
  const P = map.latLngToContainerPoint(ll);
  let best = null;
  Object.keys(shapes).forEach(id => {
    const p = plots.find(x => x.id === id); if (!p) return;
    p.fitted.forEach((c, i) => {
      const q = map.latLngToContainerPoint(c), d = P.distanceTo(q);
      if (d < 22 && (!best || best.kind !== 'corner' || d < best.d)) best = { ll: L.latLng(c), d, kind: 'corner' };
      if (best && best.kind === 'corner') return;
      const n = p.fitted[(i + 1) % p.fitted.length], a = q, b = map.latLngToContainerPoint(n);
      const abx = b.x - a.x, aby = b.y - a.y, t = Math.max(0, Math.min(1, ((P.x - a.x) * abx + (P.y - a.y) * aby) / (abx * abx + aby * aby || 1)));
      const proj = L.point(a.x + abx * t, a.y + aby * t), de = P.distanceTo(proj);
      if (de < 12 && (!best || (best.kind === 'edge' && de < best.d))) best = { ll: map.containerPointToLatLng(proj), d: de, kind: 'edge' };
    });
  });
  return best ? { ll: best.ll, snap: best.kind } : { ll, snap: null };
}
function measureAdd(ll, exact) {
  if (!measuring) return;
  mPts.push(exact ? { ll, snap: 'place' } : measureSnap(ll));
  measureDraw();
}
function measureDraw() {
  mLayer.clearLayers();
  updateTags();
  const lls = mPts.map(p => p.ll);
  if (lls.length > 1) {
    L.polyline(lls, { color: '#111827', weight: 6, opacity: .6, interactive: false }).addTo(mLayer);
    L.polyline(lls, { color: '#fbbf24', weight: 3, dashArray: '8 6', interactive: false }).addTo(mLayer);
    for (let i = 1; i < lls.length; i++) {
      const mid = L.latLng((lls[i - 1].lat + lls[i].lat) / 2, (lls[i - 1].lng + lls[i].lng) / 2);
      L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'pl-icon', iconSize: [0, 0], html: `<div class="m-len">${fmtDist(map.distance(lls[i - 1], lls[i]))}</div>` }) }).addTo(mLayer);
    }
  }
  mPts.forEach((p, i) => {
    const mk = L.marker(p.ll, { draggable: true, keyboard: false, zIndexOffset: 3000,
      icon: L.divIcon({ className: 'pl-icon', iconSize: [0, 0], html: `<div class="m-pt ${p.snap ? 'snap' : ''}"></div>` }) }).addTo(mLayer);
    mk.on('drag', e => { mPts[i] = { ll: e.target.getLatLng(), snap: null }; measureDrawLine(); });
    mk.on('dragend', e => { mPts[i] = measureSnap(e.target.getLatLng()); measureDraw(); });
    mk.on('click', e => L.DomEvent.stopPropagation(e));
  });
  let total = 0; for (let i = 1; i < lls.length; i++) total += map.distance(lls[i - 1], lls[i]);
  const bar = $('#measure-bar');
  if (!measuring && !mPts.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML = `<span class="tot">📏 ${mPts.length > 1 ? fmtDist(total) : 'Measure'}</span>
    <button id="m-undo" ${mPts.length ? '' : 'disabled'}>Undo</button><button id="m-clear">Clear</button>
    <button class="go" id="m-done">${measuring ? 'Done' : 'Measure again'}</button>
    <span class="hint">${measuring ? (mPts.length ? 'Tap the next point. Points turn green when they snap to a plot corner or edge. Drag a point to adjust.' : 'Tap where to start: near a plot corner it snaps exactly to the corner.') : 'Line kept on the map. Clear removes it.'}</span>`;
  // stopPropagation: the bar is redrawn on click, so the map must not also treat it as a map tap
  $('#m-undo').onclick = e => { e.stopPropagation(); mPts.pop(); measureDraw(); };
  $('#m-clear').onclick = e => { e.stopPropagation(); measureClear(); };
  $('#m-done').onclick = e => { e.stopPropagation(); measuring ? measureStop() : measureStart(); };
}
// while dragging: only redraw line and labels (keep the dragged marker alive)
function measureDrawLine() {
  mLayer.eachLayer(l => { if (l instanceof L.Polyline || (l.options.icon && /m-len/.test(l.options.icon.options.html || ''))) mLayer.removeLayer(l); });
  const lls = mPts.map(p => p.ll);
  if (lls.length > 1) {
    L.polyline(lls, { color: '#111827', weight: 6, opacity: .6, interactive: false }).addTo(mLayer);
    L.polyline(lls, { color: '#fbbf24', weight: 3, dashArray: '8 6', interactive: false }).addTo(mLayer);
    for (let i = 1; i < lls.length; i++) {
      const mid = L.latLng((lls[i - 1].lat + lls[i].lat) / 2, (lls[i - 1].lng + lls[i].lng) / 2);
      L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'pl-icon', iconSize: [0, 0], html: `<div class="m-len">${fmtDist(map.distance(lls[i - 1], lls[i]))}</div>` }) }).addTo(mLayer);
    }
  }
  let total = 0; for (let i = 1; i < lls.length; i++) total += map.distance(lls[i - 1], lls[i]);
  const t = document.querySelector('#measure-bar .tot'); if (t) t.textContent = '📏 ' + (lls.length > 1 ? fmtDist(total) : 'Measure');
}

function tvDrawLengths(p) {
  tvLayer.clearLayers();
  if (!p) return;
  const f = KGeo.makeFrame(p.fitted), xy = p.fitted.map(f.toXY);
  const c = xy.reduce((a, q) => [a[0] + q[0] / 4, a[1] + q[1] / 4], [0, 0]);
  const calc = KGeo.sideLengthsLatLng(p.fitted);
  SIDES.forEach((k, i) => {
    const a = xy[i], b = xy[(i + 1) % 4];
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const d = Math.hypot(m[0] - c[0], m[1] - c[1]) || 1;
    const out = [m[0] + (m[0] - c[0]) / d * 3.5, m[1] + (m[1] - c[1]) / d * 3.5];   // 3.5 m outside the edge
    const len = (p.sides && p.sides[k]) || calc[i];
    const isRoad = p.road === k;
    L.marker(f.toLL(out), { interactive: false, keyboard: false,
      icon: L.divIcon({ className: 'pl-icon', iconSize: [0, 0], html: `<div class="tv-len ${isRoad ? 'road' : ''}">${len.toFixed(1)} m${isRoad ? ' · ROAD' : ''}</div>` }) }).addTo(tvLayer);
  });
}

/* =====================================================================
   LIVE FIELD TEST
   The field phone opens  ?live=CODE  and sends each step to a private
   channel; the laptop opens  ?watch=CODE  and sees it live.
   Channel: ntfy.sh (free relay). Anyone with the code can read it,
   so use it for tests only, not for real client data.
   ===================================================================== */
const qs = new URLSearchParams(location.search);
const cleanCode = c => (c && /^[a-z0-9]{6,20}$/.test(c)) ? c : null;
const liveCode = cleanCode(qs.get('live')), watchCode = cleanCode(qs.get('watch'));
const LIVE_URL = code => 'https://ntfy.sh/kodh-live-' + code;
let liveFailShown = false, liveDotWatch = null, liveLastPos = 0;

function livePub(obj) {
  if (!liveCode) return;
  obj.ts = Date.now();
  fetch(LIVE_URL(liveCode), { method: 'POST', body: JSON.stringify(obj) }).catch(() => {
    if (!liveFailShown) { liveFailShown = true; toast('Live link has no internet right now. Keep going; it will retry with the next step.'); setTimeout(() => liveFailShown = false, 20000); }
  });
}
function livePhoto(i, dataUrl) {
  if (!liveCode) return;
  fetch(dataUrl).then(r => r.blob()).then(blob => fetch(LIVE_URL(liveCode), { method: 'PUT', body: blob,
    headers: { 'Filename': 'brick-' + 'ABCD'[i] + '.jpg', 'X-Message': JSON.stringify({ t: 'photo', i, ts: Date.now() }) } })).catch(() => {});
}
function startLiveDot() {
  if (!liveCode || liveDotWatch != null || gpsMode !== 'real' || !navigator.geolocation) return;
  liveDotWatch = navigator.geolocation.watchPosition(pos => {
    if (Date.now() - liveLastPos < 8000) return;
    liveLastPos = Date.now();
    livePub({ t: 'pos', lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy * 10) / 10 });
  }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function liveBanner() {
  return liveCode ? `<div class="live-banner"><span class="live-dot"></span><span>LIVE TEST · code ${liveCode} · your team sees every step. Use <b>Real GPS</b>.</span></div>` : '';
}

/* ---------- Watch screen ---------- */
let wMap = null;
const W = { connected: false, hello: null, details: null, pos: null, trail: [], caps: [[], [], [], []], now: null, photos: {}, sides: null, result: null, saved: false, last: 0, log: [] };
let wLayers = null, wBase = null, wFitted = false;
const wSeen = new Set();

function startWatch() {
  document.body.classList.add('watching');
  const brand = document.querySelector('.brand'); brand.style.cursor = 'pointer'; brand.title = 'Back to dashboard'; brand.onclick = () => { location.href = location.pathname; };
  show('watch');
  wMap = L.map('w-map', { maxZoom: 21 }).setView(JIJIGA, 14);
  wLayers = { trail: L.layerGroup().addTo(wMap), raw: L.layerGroup().addTo(wMap), shapes: L.layerGroup().addTo(wMap), dot: L.layerGroup().addTo(wMap) };
  setWBase(mapChoice);
  wRender();
  const es = new EventSource(LIVE_URL(watchCode) + '/sse?since=all');
  es.onopen = () => { W.connected = true; wRender(); };
  es.onerror = () => { W.connected = false; wRender(); };
  es.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch (x) { return; }
    if (d.event && d.event !== 'message') return;
    if (d.id) { if (wSeen.has(d.id)) return; wSeen.add(d.id); }      // ignore repeats after a reconnect
    let m; try { m = JSON.parse(d.message); } catch (x) { return; }
    if (m.t === 'photo' && d.attachment) m.url = d.attachment.url;
    wHandle(m);
  };
  setInterval(wRenderSide, 1000);
}
async function setWBase(name) {
  const l = await makeBase(name); if (!l) return setWBase('sat');
  if (wBase) wMap.removeLayer(wBase);
  wBase = l.addTo(wMap); mapChoice = name; wRenderSide();
}
function wLog(t) { W.log.unshift(new Date().toLocaleTimeString() + ' · ' + t); W.log = W.log.slice(0, 60); }
function wHandle(m) {
  W.last = Math.max(W.last, m.ts || 0);
  const L_ = i => 'ABCD'[i];
  switch (m.t) {
    case 'hello': W.hello = m; wLog('Friend opened the link'); break;
    case 'details': W.details = m; wLog('Details: ' + m.area + ', ' + fmtBirr(m.price)); break;
    case 'pos': W.pos = m; W.trail.push([m.lat, m.lng]); if (W.trail.length > 400) W.trail.shift(); break;
    case 'cap_start': W.now = m.i; wLog('Capturing brick ' + L_(m.i) + (m.mode === 'demo' ? ' (practice GPS)' : '')); break;
    case 'corner': W.now = null; W.caps[m.i].push(m); wLog('Brick ' + L_(m.i) + ' captured ±' + m.acc + ' m, ' + m.n + ' readings'); break;
    case 'photo': W.photos[m.i] = m.url; wLog('Photo of brick ' + L_(m.i)); break;
    case 'sides': W.sides = m.sides; wLog('Tape sizes entered'); break;
    case 'result': W.result = m; wLog(m.ok ? 'Shape checked: ' + Math.round(m.area) + ' m²' : 'Shape problem: ' + m.error); break;
    case 'saved': W.saved = true; wLog('Plot saved on the phone'); break;
  }
  wRender();
}
const mPerDeg = lat => [111320 * Math.cos(lat * Math.PI / 180), 110540];
function spread(c) {          // how scattered the readings were (metres, typical distance from the average)
  if (!c.raw || !c.raw.length) return null;
  const [kx, ky] = mPerDeg(c.lat);
  const d = c.raw.map(r => Math.hypot(r[1] * 1e-6 * kx, r[0] * 1e-6 * ky));
  return Math.sqrt(d.reduce((a, x) => a + x * x, 0) / d.length);
}
async function wImport() {
  if (W.imported) { location.href = location.pathname; return; }
  const latest = W.caps.map(a => a[a.length - 1]);
  if (latest.some(c => !c) || !W.result || !W.result.ok) return;
  const toData = async url => { try { const b = await (await fetch(url)).blob(); return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); } catch (e) { return null; } };
  const photos = await Promise.all([0, 1, 2, 3].map(i => W.photos[i] ? toData(W.photos[i]) : null));
  const sides = {}; Object.keys(W.sides || {}).forEach(k => { const v = parseFloat(W.sides[k]); if (v > 0) sides[k] = v; });
  plots.push({
    id: 'p' + Date.now().toString(36), demo: false, area: (W.details && W.details.area) || 'Field test',
    title: 'Field test · ' + ((W.details && W.details.area) || watchCode), price: (W.details && W.details.price) || 0, status: 'sale',
    owner: '', phone: '', road: (W.details && W.details.road) || '', notes: 'Captured live in the field (test ' + watchCode + ').',
    corners: latest.map((c, i) => ({ lat: c.lat, lng: c.lng, acc: c.acc, n: c.n, photo: photos[i] })),
    sides, fitted: W.result.fitted, areaM2: W.result.area, method: W.result.method, rms: 0, created: Date.now()
  });
  save(); W.imported = true; wRenderSide();
  toast('Added to your map. Tap again to open it.');
}
function capDist(a, b) { const [kx, ky] = mPerDeg(a.lat); return Math.hypot((a.lng - b.lng) * kx, (a.lat - b.lat) * ky); }

function wRender() {
  if (!wMap) return;
  wLayers.trail.clearLayers(); wLayers.raw.clearLayers(); wLayers.shapes.clearLayers(); wLayers.dot.clearLayers();
  if (W.trail.length > 1) L.polyline(W.trail, { color: '#60a5fa', weight: 2, opacity: .5, dashArray: '3 6' }).addTo(wLayers.trail);
  const latest = W.caps.map(a => a[a.length - 1]);
  W.caps.forEach((arr, i) => arr.forEach((c, k) => {
    const isLast = k === arr.length - 1;
    if (isLast && c.raw) { const [kx, ky] = [1, 1]; c.raw.forEach(r => L.circleMarker([c.lat + r[0] * 1e-6, c.lng + r[1] * 1e-6], { radius: 2, color: '#93c5fd', weight: 0, fillOpacity: .7 }).addTo(wLayers.raw)); }
    L.circleMarker([c.lat, c.lng], isLast ? { radius: 9, color: '#fff', weight: 2, fillColor: '#22c55e', fillOpacity: 1 } : { radius: 5, color: '#fff', weight: 1, fillColor: '#8b97a3', fillOpacity: 1 })
      .bindTooltip('ABCD'[i] + (isLast ? '' : ' (earlier)'), { permanent: isLast, direction: 'top', className: 'price-tag' }).addTo(wLayers.shapes);
  }));

  if (pts.length >= 2) L.polyline(pts.length === 4 ? pts.concat([pts[0]]) : pts, { color: '#60a5fa', weight: 2, dashArray: '6 6' }).addTo(wLayers.shapes);
  if (W.result && W.result.ok) L.polygon(W.result.fitted, { color: '#fff', weight: 3, fillColor: '#fff', fillOpacity: .15 }).addTo(wLayers.shapes);
  if (W.pos) {
    L.circle([W.pos.lat, W.pos.lng], { radius: W.pos.acc || 5, color: '#3b82f6', weight: 1, fillOpacity: .12 }).addTo(wLayers.dot);
    L.circleMarker([W.pos.lat, W.pos.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#3b82f6', fillOpacity: 1 }).bindTooltip('Friend', { direction: 'right' }).addTo(wLayers.dot);
  }
  const all = pts.concat(W.pos ? [[W.pos.lat, W.pos.lng]] : []);
  if (all.length && !wFitted) { wMap.setView(all[all.length - 1], 19); wFitted = true; }
  wRenderSide();
}
function wRenderSide() {

  }).join('');

  const res = W.result ? (W.result.ok ? `<div class="stats"><div class="stat"><b>${m2(W.result.area)}</b><span>Land size</span></div><div class="stat"><b>${W.result.residuals.map(x => x.toFixed(1)).join(' / ')} m</b><span>Brick vs tape A/B/C/D</span></div></div>${(W.result.warnings || []).map(w => `<div class="warn">${esc(w)}</div>`).join('')}` : `<div class="err">${esc(W.result.error)}</div>`) : '<div class="note">Not checked yet</div>';
  side.innerHTML = `

    <h2>Live test · ${watchCode}</h2>
    <div class="wstat ${W.connected ? 'ok' : 'bad'}"><i></i>${W.connected ? 'Connected' : 'Connecting…'}${ago != null ? ` · friend's last update ${ago < 60 ? ago + ' s' : Math.round(ago / 60) + ' min'} ago` : ' · nothing from the friend yet'}</div>
    ${W.details ? `<div class="note"><b>${esc(W.details.area)}</b> · ${fmtBirr(W.details.price)}${W.details.road ? ' · road side ' + sideName(W.details.road) : ''}</div>` : ''}
    <div class="chips">${Object.keys(MAP_NAMES).map(k => `<button class="chip ${mapChoice === k ? 'on' : ''}" data-wl="${k}">${MAP_NAMES[k]}</button>`).join('')}</div>
    <div class="sec"><h4>Corner bricks · ${done} of 4</h4><div class="bricks">${corners}</div></div>
    <div class="sec"><h4>Tape sizes</h4>${sidesHtml}</div>
    <div class="sec"><h4>Result</h4>${res}${W.saved ? '<div class="good" style="margin-top:8px">Saved on the friend’s phone</div>' : ''}</div>
    ${W.result && W.result.ok ? `<button class="btn primary" id="w-import">${W.imported ? 'Added to your map ✓' : 'Add this plot to my map'}</button>` : ''}
    <div class="btns"><button class="btn ghost" id="w-follow">Go to friend</button><button class="btn ghost" id="w-copy">Copy test data</button></div>
    <div class="sec"><h4>Activity</h4><div class="wlog">${W.log.map(esc).map(x => `<div>${x}</div>`).join('') || 'Nothing yet'}</div></div>`;
  side.querySelectorAll('[data-wl]').forEach(b => b.onclick = () => setWBase(b.dataset.wl));
  side.querySelectorAll('[data-photo]').forEach(d => d.onclick = () => window.open(W.photos[+d.dataset.photo], '_blank'));
  $('#w-follow').onclick = () => { const t = W.pos ? [W.pos.lat, W.pos.lng] : (latest.find(Boolean) ? [latest.find(Boolean).lat, latest.find(Boolean).lng] : null); if (t) wMap.setView(t, 19); else toast('No position from the friend yet'); };
  if ($('#w-import')) $('#w-import').onclick = wImport;
  $('#w-copy').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify({ code: watchCode, details: W.details, caps: W.caps, sides: W.sides, result: W.result, trail: W.trail }, null, 1)); toast('Test data copied. Paste it to Claude to analyse.'); } catch (e) { toast('Copy was blocked'); } };
}

/* ---------------- start ---------------- */
renderMap(true);
renderPlaces();
if (isPhone()) setSheet(true);
if (watchCode) startWatch();
else if (liveCode) {
  if (navigator.geolocation && window.isSecureContext) gpsMode = 'real';
  livePub({ t: 'hello', ua: navigator.userAgent.slice(0, 90) });
  show('capture');
}
</script>
</body>
</html>
